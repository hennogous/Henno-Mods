          - LP.PEDIA.DISTRICT_CHAPTERS
          - LP.PEDIA.RESOURCE_REVERSE_APPEND
          - LP.PEDIA.SALES_DISTRICT_APPEND
          - LP.CIVIC.APPEND
        outputs: [localization_source, localization_generated, hemp_localization_source, hemp_localization_generated, llamas_localization_source, llamas_localization_generated, r2_localization_source, r2_localization_generated, cashmere_localization_source, cashmere_localization_generated, sukritact_gold_localization_source, sukritact_gold_localization_generated, city_lights_localization_source, city_lights_localization_generated]
        static_assertions:
          - "Every implemented effect appears once in gameplay text and no unimplemented effect is claimed."
          - "Pedia customer and Civic append coverage is complete."
          - "Every replacement-sensitive customer description is appended to the base type and each direct replacement exactly once."
          - "Tailors district pedia has the unadorned headers Base Materials, Specialty Materials, Goods Providers, Sales Districts, and Historical Context in the Bakers order; no pedia section header contains a text icon."
          - "Core and conditional modded Tailors resources each receive a Supply Chains reverse entry identifying their Base or Specialty material role."
          - "Every resource page contains at most one `Base Materials:` group and at most one `Specialty Materials:` group; each Quarter is one bullet beneath its applicable group."
          - "Each resource role label is followed by exactly one open line (`[NEWLINE][NEWLINE]`) before its first Quarter bullet; additional bullets in that role use one `[NEWLINE]`."
          - "Flax composes as one Base Materials group containing separate Bakers' Quarter and Tailors' Quarter bullets, never two singular Base material lines."
          - "Tailors' Quarter Historical Context lets the supply chain progression emerge through original prose and never labels or announces it as an arc."
          - "Every ordinary Tailors sales district appends an evocative relationship sentence and a separate gameplay sentence to one shared Supply Chains section without replacing other Quarter entries."
          - "The Commercial Hub is deliberately curated as one integrated Bakers-and-Tailors passage rather than accumulated from deterministic Quarter fragments."
        replacement_binding:
          customer_description_appends: explicit_direct_one_level
          named_wonders_and_CSC_objects: never_expand
        runtime_scenarios:
