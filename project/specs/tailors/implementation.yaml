    assertion_module: project/tools/quarter_contracts/quarter_checks/tailors_assertions.py
validation_ownership:
  automated:
    owner: implementation_agent
    required_before_handoff: true
    scope: [schema, contract, generated_output, SQL_style, localization_patterns, smoke_tests]
  in_game:
    owner: user
    required_before_handoff: false
    required_for_final_acceptance: true
    scenarios_field: runtime_scenarios

sql_style_profiles:
  core: core
  gold: gold
  monopolies: monopolies
  monopolies_gold: monopolies_gold

implementation_rules:
  - GP.FILE.SECTION_ORDER
  - GP.REPLACEMENT.DIRECT_ONE_LEVEL
  - GP.GOLD.COMPANION_SPLIT
  - "Every referenced LP.* pattern's authorship_mode is binding: strict_template wording is substituted, deterministic_composition is generated from implementation data, structured_original_prose preserves architecture but must be freshly written, and curated_integrated_prose requires editorial integration across all participating Quarters."
  - "Never treat a Bakers source_anchor as prose to reskin when its authorship_mode requires original or curated writing."
  - "No Bakers-only pattern may be used."
  - "No Tailors gameplay output may be written until its phase is approved in control.yaml."
  - "Adjacent-building transactions are not gated by adjacent material supply; only Stage 2 material-supplier transactions use material availability as part of the transaction itself."
  - "Art bridge properties share the complete owner requirement set of the related Service, including unlock, material supply, and at least one eligible adjacent Service customer."
  - "runtime_scenarios are user-owned later acceptance tests; the implementation agent records them but is not required to launch Civ VI or execute them before handoff."

replacement_policy:
  scope: direct_one_level
  engine_inherited:
    building_presence_requirements: REQUIREMENT_CITY_HAS_BUILDING
    district_type_requirements: REQUIREMENT_PLOT_DISTRICT_TYPE_MATCHES
    building_yield_effects: MODIFIER_BUILDING_YIELD_CHANGE
  explicit_direct_expansion:
    - BuildingModifiers
    - building_and_district_description_appends
    - MAB_TypeTags_and_generated_return_adjacencies
    - Lua_building_and_district_type_lookups
  never_expand: [named_wonders, CSC_owned_buildings_and_districts]
  invariants:
    - "Do not duplicate an engine-inherited effect for a unique replacement."
    - "Do not recursively chase replacements of replacements."
    - "Every replacement-sensitive requirement states which surface is inherited and which is explicitly expanded."

