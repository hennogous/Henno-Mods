phases:
  - id: foundation
    purpose: Types, material classes, core mappings, district definition, and district adjacencies.
    requirements:
      - id: I.IDENTITY_AND_TYPES
        design_refs: [identity, district.type, buildings]
        gameplay_patterns: [GP.TYPE.QUARTER_OBJECTS]
        localization_patterns: [LP.NAMES.COMPLETE]
        outputs: [core, localization_source]
        static_assertions:
          - "Every district, stage building, and service Type exists exactly once."
          - "No Water/Wind variants or river flag buildings are introduced."
        runtime_scenarios:
          - "Civilopedia resolves every Tailors object name without a raw LOC key."

      - id: I.MATERIAL_CLASSES
        design_refs: [materials]
        gameplay_patterns: [GP.TAG.MATERIAL_CLASSES, GP.MODSUPPORT.RESOURCE_CLASS_MAPPING]
        localization_patterns: [LP.PEDIA.DISTRICT_CHAPTERS]
        outputs: [core, localization_source]
        static_assertions:
          - "Core maps Cotton, Sheep, Flax to BASE."
          - "Core maps Dyes, Silk, Silver to SPEC."
          - "Optional resources are not duplicated in core."
        runtime_scenarios:
          - "With no optional resource mods, every standard/CSC material is classified correctly."
          - "With each optional mod, its preserved resource mapping is active."

      - id: I.DISTRICT_DEFINITION
        design_refs: [district]
        gameplay_patterns: [GP.DISTRICT.DEFINITION]
        localization_patterns: [LP.DISTRICT.SUMMARY, LP.PEDIA.DISTRICT_CHAPTERS]
        outputs: [core, localization_source]
        static_assertions:
          - "Unlock=Craftsmanship, Cost=60, Maintenance=1."
        runtime_scenarios:
          - "Tailors' Quarter becomes buildable at Craftsmanship at the specified cost."

      - id: I.DISTRICT_MATERIAL_ADJACENCY
        design_refs: [district.effects.D.DISTRICT.MATERIAL_INPUTS]
        gameplay_patterns: [GP.DISTRICT.MATERIAL_ADJACENCY]
        localization_patterns: [LP.DISTRICT.ADJACENCY_BULLET]
        outputs: [core, localization_source]
        static_assertions:
          - "BASE and SPEC each provide exactly +1 Production adjacency."
        runtime_scenarios:
          - "Each adjacent matching resource adds 1 Production; unrelated resources add none."

      - id: I.DISTRICT_CUSTOMER_ADJACENCIES
        design_refs:
          - district.effects.D.DISTRICT.INTERMEDIARY_GOODS_CUSTOMERS
          - district.effects.D.DISTRICT.GOODS_SALES_CUSTOMERS
        gameplay_patterns: [GP.DISTRICT.BILATERAL_ADJACENCY, GP.REPLACEMENT.DIRECT_ONE_LEVEL]
        localization_patterns: [LP.DISTRICT.BILATERAL_BULLET]
        outputs: [core, gold, localization_source]
        static_assertions:
          - "Harbor: Tailors +1 Gold; Harbor +1 Production."
          - "Commercial Hub/Holy Site/Theater: Tailors +1 Gold; customer +1 Culture."
          - "MAB customer tags and generated return adjacencies explicitly include each direct unique district replacement exactly once."
        replacement_binding:
          MAB_TypeTags_and_generated_return_adjacencies: explicit_direct_one_level
        runtime_scenarios:
          - "Test every customer district separately and verify both transaction directions."

      - id: I.DISTRICT_RIVER
        design_refs: [district.effects.D.DISTRICT.LOGISTICS]
        gameplay_patterns: [GP.DISTRICT.RIVER_EDGES]
        localization_patterns: [LP.DISTRICT.ADJACENCY_BULLET]
        outputs: [core, localization_source]
        static_assertions:
          - "One Production is granted per two adjacent river edges."
        runtime_scenarios:
          - "Compare placements with 0, 1, 2, 3, and 4 adjacent river edges."

  - id: materials_and_stage2
    purpose: Material improvement exchanges, Textile Workshop, and Dockmaster.
    requirements:
      - id: I.MATERIAL_IMPROVEMENT_EXCHANGES
        design_refs: [material_improvements.D.MATERIAL.BASE]
        gameplay_patterns: [GP.MATERIAL.IMPROVEMENT_FROM_BUILDING, GP.MC.MATERIAL_TOTALS]
        localization_patterns: [LP.MATERIAL.BULLET, LP.MC.SUB_BULLET]
        outputs: [core, gold, monopolies, monopolies_gold, localization_source, monopolies_localization_generated]
        static_assertions:
          - "Base-material standard totals are 1 Production and 1 Gold."
          - "Industry totals are 2/2 and Corporation totals are 3/3."
          - "Industry and Corporation wording is emitted only by a Monopolies_Mode-gated UpdateText action."
        runtime_scenarios:
          - "Test standard improvement, Industry, and Corporation adjacent to the correct stage building."

      - id: I.STAGE2_DEFINITION
        design_refs: [buildings.D.STAGE2]
        gameplay_patterns: [GP.BUILDING.DEFINITION]
        localization_patterns: [LP.PEDIA.BUILDING_CHAPTERS]
        outputs: [core, localization_source]
        static_assertions:
          - "Unlock=Construction, Cost=80, Maintenance=2."
          - "ICON_BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP uses the shared Quarter atlas stage-2-building index 4."
        runtime_scenarios:
          - "Textile Workshop requires only its designed technology and Quarter."

      - id: I.STAGE2_BASE_INPUT
        design_refs: [buildings.D.STAGE2.effects.D.STAGE2.BASE_INPUT]
        gameplay_patterns: [GP.MATERIAL.BUILDING_FROM_IMPROVEMENT, GP.MC.MATERIAL_TOTALS]
        localization_patterns: [LP.MATERIAL.BULLET, LP.MC.SUB_BULLET]
        outputs: [core, monopolies, localization_source, monopolies_localization_generated]
        static_assertions:
          - "Culture totals are standard 1, Industry 2, Corporation 3."
          - "The Textile Workshop base description contains no Industry or Corporation wording outside Monopolies_Mode."
        runtime_scenarios:
          - "Test Base standard improvement, Industry, and Corporation; Specialty gives no Culture."

      - id: I.STAGE2_CUSTOMER_AND_LOCAL
        design_refs:
          - buildings.D.STAGE2.effects.D.STAGE2.INTERMEDIARY_GOODS_CUSTOMER
          - buildings.D.STAGE2.effects.D.STAGE2.LOCAL_CUSTOMERS
        gameplay_patterns: [GP.BUILDING.CUSTOMER_TRANSACTION, GP.BUILDING.LOCAL_EXCHANGE, GP.REPLACEMENT.DIRECT_ONE_LEVEL]
        localization_patterns: [LP.CUSTOMER.BILATERAL_BULLET, LP.STAGE2.CUSTOMER.NO_CITY_SUFFIX, LP.LOCAL.DOWNSTREAM_EXCHANGE_BULLET, LP.PEDIA.CUSTOMER_APPEND]
        outputs: [core, gold, localization_source]
        static_assertions:
          - "Lighthouse and local Stage 3/4 exchanges implement both directions."
          - "Lighthouse replacements inherit building-yield effects, while direct BuildingModifiers and text append rows are expanded exactly once."
          - "The Textile Workshop description lists the Lighthouse end-customer transaction before the downstream local Tailor and Fashion House transaction."
          - "The Lighthouse line is exactly `+1 [ICON_Production] Production and +1 [ICON_Gold] Gold from each adjacent Lighthouse, and +1 [ICON_Production] Production in return.` It uses `each adjacent` to make stacking explicit and has no redundant destination-city suffix."
        replacement_binding:
          lighthouse_presence_requirement: engine_inherited
          lighthouse_building_yield_effect: engine_inherited
          lighthouse_BuildingModifiers: explicit_direct_one_level
          lighthouse_description_append: explicit_direct_one_level
          local_CSC_buildings: never_expand
        runtime_scenarios:
          - "Test Lighthouse adjacency and each local building independently."

      - id: I.DOCKMASTER
        design_refs: [buildings.D.STAGE2.effects.D.STAGE2.SERVICE, art.properties.D.ART.STAGE2.LIGHTHOUSE]
        gameplay_patterns: [GP.SERVICE.HIDDEN_BUILDING, GP.SERVICE.EFFECTS, GP.SERVICE.PRESENTATION_ANCHOR, GP.REPLACEMENT.DIRECT_ONE_LEVEL]
        localization_patterns: [LP.SERVICE.INTRO, LP.SERVICE.EFFECT, LP.SERVICE.STACKING_CIVIC, LP.PEDIA.SERVICE_CHAPTERS, LP.CIVIC.APPEND, LP.NOTIFICATION.SERVICE_STATE]
        outputs: [core, localization_source]
        static_assertions:
          - "Requires Naval Tradition, supplied BASE, adjacent Harbor, functioning Lighthouse."
          - "Effect is +20% Production to naval units through Renaissance, +1 slot, and +1 Admiral point."
          - "ICON_BUILDING_CSC_TAILORS_STAGE_2_SERVICE uses the shared Quarter atlas stage-2-service index 8."
          - "Because Naval Tradition has no base description, its Tailors append has no text-prefix and begins with its first visible character; it says the Production and Great Admiral point are from each adjacent supplied Textile Workshop."
          - "The Civic SQL nevertheless handles both states: NULL/empty uses the bare LOC_CSC_TAILORS_STAGE_2_CIVIC key, while an existing visible description composes the `[NEWLINE][NEWLINE]`-prefixed LOC_CSC_TAILORS_STAGE_2_CIVIC_APPEND key."
          - "The naval production effect is generated as the 12-row cross product of four eras and three naval promotion classes."
          - "Exactly one mechanically real Dockmaster attach/effect pair is the MCUIS presentation anchor."
          - "Exactly one Dockmaster row exists in CSC_AbilityAttachModifiers and exactly one aggregate notification string family exists."
          - "All non-anchor naval-production siblings share the anchor's gates and have no MCUIS helper row or notification strings."
          - "Dockmaster MCUIS and notification strings render the pre-signed dynamic amount directly; they add no literal sign or directional qualifier."
          - "The Dockmaster MCUIS Preview supply-chain line displays the total contributing-source count and pluralizes `Textile Workshop` from `{3_TotalStackCount}`. Count omission is reserved for a mechanically non-stacking service whose contract explicitly declares that exception."
          - "Dockmaster NEW/INCREASED/DECREASED/REMOVED notification fragments have no terminal punctuation because LOC_NOTIFICATION_HENNO_*_CITY_QUARTER_ABILITY_SUMMARY supplies the single final period; the REMOVED fragment keeps its internal sentence break but ends with `remain`, not `remain.`."
          - "MCUIS removal text deactivates the gated production and Admiral-point effects without claiming that the persistent Dockmaster building or Citizen slot was removed."
          - "The Dockmaster Civilopedia page matches the Bakers Service-page scope exactly: one Supply Chains chapter and one Historical Context chapter, with no separate Description chapter."
          - "Its Supply Chains entry follows the Storekeeper/Innkeeper rhythm: Textile Workshop plus improved Base Materials to cloth and sail canvas to the Lighthouse, then one paragraph break and `This gives a Citizen the opportunity to take up employment as a Dockmaster in the Harbor...` expressing naval production and Great Admiral development in-world."
          - "Its Historical Context entry explains dockmasters' coordination of berths, crews, stores, repairs, and naval logistics."
          - "CSC retains REQSET_CSC_TAILORS_STAGE_2_EFFECT_PREREQ as the complete Dockmaster activation gate. The optional CSC Art Pack owns the source-property modifier, building attachment, Lua mirror, GamePropertyRanges, selection rule, and alternate model; none of those bridge files or rows are core Tailors outputs."
        implementation_binding:
          service_grant:
            method: persistent_hidden_building
            building_type: BUILDING_CSC_TAILORS_STAGE_2_SERVICE
            citizen_slots: 1
          naval_production:
            amount_percent: 20
            modifier_type: MODIFIER_CSC_TAILORS_SINGLE_CITY_ADJUST_UNIT_TAG_ERA_PRODUCTION
            collection_type: COLLECTION_OWNER
            effect_type: EFFECT_ADJUST_UNIT_TAG_ERA_PRODUCTION
            eras: [ERA_ANCIENT, ERA_CLASSICAL, ERA_MEDIEVAL, ERA_RENAISSANCE]
            promotion_classes: [PROMOTION_CLASS_NAVAL_MELEE, PROMOTION_CLASS_NAVAL_RANGED, PROMOTION_CLASS_NAVAL_RAIDER]
            generation: era_by_promotion_class_cross_product
            expected_mechanical_modifier_count: 12
          gated_sibling_effects:
            great_person_points: {GREAT_PERSON_CLASS_ADMIRAL: 1}
          mcuis:
            logical_ability_count: 1
            presentation_anchor: exactly_one_mechanically_real_attach_effect_pair
            helper_table: CSC_AbilityAttachModifiers
            helper_row_count: 1
            primary_amount: 20
            modifier_string_context: Preview
            notification_variants: [NEW, INCREASED, DECREASED, REMOVED]
            ability_icon: ICON_BUILDING_CSC_TAILORS_STAGE_2_SERVICE
            ability_icon_target: BUILDING_CSC_TAILORS_STAGE_2_SERVICE
            non_anchor_policy: no_helper_row_or_notification_strings
          activation_equivalence:
            owner_requirements: identical_across_all_mechanical_siblings
            subject_requirements: identical_across_all_mechanical_siblings
          invariant: "The one MCUIS presentation anchor represents the complete live Dockmaster ability; it does not replace or multiply the mechanical modifier family."
        replacement_binding:
          harbor_destination_requirement: engine_inherited
          lighthouse_presence_requirement: engine_inherited
          service_and_CSC_source_buildings: never_expand
          customer_description_append: explicit_direct_one_level
        runtime_scenarios:
          - "Prove each prerequisite gate independently and verify Ancient through Renaissance naval melee, ranged, and raider units receive exactly +20%, while Industrial and later units receive none."
          - "Verify one Dockmaster MCUIS icon and one notification transition, never one per era or promotion class."

  - id: stage3
    purpose: Tailor, population transaction, Sacristan, and domestic trade.
    requirements:
      - id: I.STAGE3_DEFINITION_LOCAL_SPECIALISTS
        design_refs:
          - buildings.D.STAGE3
          - buildings.D.STAGE3.effects.D.STAGE3.LOCAL
          - buildings.D.STAGE3.effects.D.STAGE3.SPECIALISTS
          - buildings.D.STAGE3.effects.D.STAGE3.AMENITY
        gameplay_patterns:
          - GP.BUILDING.DEFINITION
          - GP.BUILDING.LOCAL_EXCHANGE
          - GP.BUILDING.CITIZEN_YIELDS
          - GP.BUILDING.CITY_AMENITY
        localization_patterns: [LP.BUILDING.ENGINE_RENDERED_STATS_OMITTED, LP.LOCAL.EXCHANGE_BULLET, LP.PEDIA.BUILDING_CHAPTERS]
        outputs: [core, gold, localization_source, icons]
        static_assertions:
          - "Unlock=Guilds, prerequisite Textile Workshop, Cost=160, Maintenance=2."
          - "One slot; specialists +2 Culture/+1 Gold; city +1 Amenity."
          - "The completed Tailor description omits its Citizen slot, specialist yields, and intrinsic city Amenity because Civ VI renders those database fields below the authored description; it contains the remaining Stage 3 relationships in shared order: local Textile Workshop exchange; adjacent Temple/Market population exchange; domestic trade exchange; Sacristan establishment. Transaction effects granted to another city, including the trade-route origin Amenity, remain explicit."
          - "The Tailor Civilopedia page matches the Bakery's format: exactly one Supply Chains title/paragraph followed by one Historical Context title with two history paragraphs, and no Civilopedia Description chapter."
          - "Tailor Supply Chains prose follows cloth from the local Textile Workshop into finished garments for adjacent Temples and Markets; its history covers the specialized urban tailoring trade and its expansion through guild, religious, and market demand."
          - "ICON_BUILDING_CSC_TAILORS_TAILOR uses the Tailors atlas index 5, and Icons/CSC_TAILORS_ICONS.sql is Content loaded by the shared UpdateIcons action."
          - "The Tailor population transaction with an adjacent Temple or Market has no material-supply owner gate."
        runtime_scenarios:
          - "Verify local exchange, specialist yields, and amenity independently; inspect the Tailor icon, complete description, and both Civilopedia chapters."

      - id: I.STAGE3_POP_CUSTOMERS
        design_refs: [buildings.D.STAGE3.effects.D.STAGE3.POP_CUSTOMERS]
        gameplay_patterns: [GP.BUILDING.CUSTOMER_TRANSACTION, GP.SCALING.PER_POPULATION_DECIMAL, GP.REPLACEMENT.DIRECT_ONE_LEVEL]
        localization_patterns: [LP.CUSTOMER.BILATERAL_BULLET, LP.PEDIA.CUSTOMER_APPEND]
        outputs: [core, gold, localization_source]
        static_assertions:
          - "Temple/Market city gets 0.1 Culture per its citizens."
          - "Tailor city gets 0.1 Production and 0.1 Gold per customer-city citizen."
          - "Each eligible adjacent customer city is counted once, and direct one-level replacements are included."
          - "Temple and Market pages each retain one integrated Supply Chains section describing their Tailor population exchange; the Temple entry also carries the concise Sacristan pointer required by I.SACRISTAN."
        implementation_binding:
          customer_side:
            method: direct_per_population_modifier
            modifier_type: MODIFIER_SINGLE_CITY_ADJUST_CITY_YIELD_PER_POPULATION
            declared_amount_per_citizen: 0.1
            bakers_engine_amount: 0.105
          tailor_return_side:
            method: shared_customer_population_lua_property_bit_bridge
            reference_script: Civ Supply Chains/Lua_UI/CustomerPopulationReturns/CSC_CustomerPopulationReturns.lua
            aggregation: sum_each_eligible_adjacent_customer_city_population_once
            replacement_traversal: direct_one_level
            declared_amount_per_customer_citizen: 0.1
            bakers_engine_amount: 0.105
            amount_scale: 10000
          invariant: "Extend and parameterize the shared bridge for Tailors, replacing its current recursive replacement-family traversal with direct one-level expansion; do not copy Bakers-only resource, building, yield, or property identifiers."
        replacement_binding:
          market_and_temple_presence_requirements: engine_inherited
          customer_city_yield_effects: engine_inherited
          customer_population_Lua_lookups: explicit_direct_one_level
          customer_description_appends: explicit_direct_one_level
        runtime_scenarios:
          - "Test both customers at populations 1, 5, 10, including direct replacements."

      - id: I.SACRISTAN
        design_refs: [buildings.D.STAGE3.effects.D.STAGE3.SERVICE, art.properties.D.ART.STAGE3.CUSTOMERS]
        gameplay_patterns: [GP.SERVICE.HIDDEN_BUILDING, GP.SERVICE.EFFECTS, GP.SERVICE.PRESENTATION_ANCHOR, GP.REPLACEMENT.DIRECT_ONE_LEVEL]
        localization_patterns: [LP.SERVICE.INTRO, LP.SERVICE.EFFECT, LP.PEDIA.SERVICE_CHAPTERS, LP.PEDIA.CUSTOMER_APPEND, LP.CIVIC.APPEND, LP.NOTIFICATION.SERVICE_STATE]
        outputs: [core, localization_source, icons]
        static_assertions:
          - "Requires Divine Right, supplied BASE, adjacent Holy Site, functioning Temple."
          - "Effect is +10% Faith, +1 slot, and +1 Prophet point."
          - "Exactly one mechanically real Sacristan attach/effect pair is the MCUIS presentation anchor; one aggregate preview and NEW/INCREASED/DECREASED/REMOVED notification family describes the complete live ability without multiplying its mechanics."
          - "The Sacristan CSC_AbilityAttachModifiers presentation row explicitly declares NotificationQuarter=TAILORS, and notification Lua dispatches from that field rather than parsing the attach-modifier name."
          - "ICON_BUILDING_CSC_TAILORS_STAGE_3_SERVICE uses Tailors atlas index 9 and is the MCUIS/notification icon target."
          - "The Sacristan Civilopedia page has exactly one Supply Chains chapter and one Historical Context chapter, with no separate Description chapter."
          - "Its Supply Chains entry follows the Storekeeper/Innkeeper structure: the Tailor draws on cloth from the Textile Workshop, creates garments or vestments for the adjacent Temple, then after one paragraph break gives a Citizen employment as a Sacristan in the Holy Site and expresses Faith and Great Prophet development in-world."
          - "Its Historical Context entry explains the care of vestments, sacred furnishings, records, and daily material needs that connected textile crafts to religious institutions."
          - "CSC retains REQSET_CSC_TAILORS_STAGE_3_EFFECT_PREREQ as the complete Sacristan activation gate. The optional CSC Art Pack owns CSC_TAILORS_STAGE_3_CUSTOMERS, its building attachment and Lua mirror; Markets remain outside that optional visual-state gate, and no alternate-art bridge rows or files are core Tailors outputs."
          - "The Holy Site and Temple pages keep one integrated Supply Chains section, state that an adjacent supplied Tailor can establish a Sacristan at Divine Right, and point to the Sacristan page; direct one-level replacements receive equivalent text."
          - "Divine Right description composition uses the bare service text only for NULL/empty base descriptions and a `[NEWLINE][NEWLINE]`-prefixed variant when visible base text exists."
        replacement_binding:
          holy_site_destination_requirement: engine_inherited
          temple_presence_requirement: engine_inherited
          customer_description_append: explicit_direct_one_level
          service_and_CSC_source_buildings: never_expand
        runtime_scenarios:
          - "Prove each prerequisite gate and remove one prerequisite after establishment; verify one MCUIS icon/notification stream and inspect the Sacristan, Holy Site, and Temple pedia integration."

      - id: I.STAGE3_TRADE
        design_refs: [buildings.D.STAGE3.effects.D.STAGE3.TRADE]
        gameplay_patterns: [GP.TRADE.DOMESTIC_SUPPLY, GP.TRADE.CITY_YIELD_PRESENTATION]
        localization_patterns: [LP.TRADE.DOMESTIC_BULLET]
        outputs: [core, gold, localization_source, trade_route_yield_presentation_suk, trade_route_yield_tooltip_suk]
        static_assertions:
          - "Destination +1 Culture; origin Quarter +1 Production/+1 Gold only without Tailors; origin +1 Amenity."
          - "The Tailor contributes one complete route transaction and stacks additively with the Fashion House transaction."
          - "The origin +1 Culture modifier has one explicit CSC_TradeRouteYieldPresentation row and Sukritact's city-yield tooltip moves exactly that active amount from Modifiers to Outgoing Trade Routes without modifier-name inference."
        trade_route_yield_presentation:
          registry_table: CSC_TradeRouteYieldPresentation
          registry_output: trade_route_yield_presentation_suk
          ui_output: trade_route_yield_tooltip_suk
          entries:
            - entry_id: CSC_TAILORS_IMPORT_CONSUMER_CULTURE
              quarter_key: TAILORS
              modifier_id: MOD_CSC_TAILORS_IMPORT_TAILOR_CULTURE
              property_name: CSC_TAILORS_IMPORT_TAILOR_ROUTE
              property_scope: CITY_CENTER_PLOT
              yield_type: YIELD_CULTURE
              amount: 1
              display_bucket: OUTGOING_TRADE_ROUTES
        runtime_scenarios:
          - "Compare domestic routes with/without Tailor supply and with/without a Tailors' Quarter at origin; with Simple UI Adjustments active, the origin +1 Culture appears under Outgoing Trade Routes rather than Modifiers."

  - id: stage4
    purpose: Fashion House, population transaction, Stage Manager, and domestic trade.
    requirements:
      - id: I.STAGE4_DEFINITION_LOCAL_SPECIALISTS
        design_refs:
          - buildings.D.STAGE4
          - buildings.D.STAGE4.effects.D.STAGE4.LOCAL
          - buildings.D.STAGE4.effects.D.STAGE4.SPECIALISTS
          - buildings.D.STAGE4.effects.D.STAGE4.REGIONAL_AMENITY
        gameplay_patterns:
          - GP.BUILDING.DEFINITION
          - GP.BUILDING.LOCAL_EXCHANGE
          - GP.BUILDING.CITIZEN_YIELDS
          - GP.BUILDING.REGIONAL_AMENITY
        localization_patterns: [LP.BUILDING.ENGINE_RENDERED_STATS_OMITTED, LP.LOCAL.EXCHANGE_BULLET, LP.PEDIA.BUILDING_CHAPTERS]
        outputs: [core, gold, localization_source, icons]
        static_assertions:
          - "Unlock=Humanism, prerequisite Textile Workshop, Cost=250, Maintenance=3."
          - "One slot; specialists +1 Culture/+2 Gold; +1 Amenity within 6."
          - "The completed Fashion House description omits its Citizen slot, specialist yields, and intrinsic regional Amenity because Civ VI renders those database fields below the authored description; it contains the remaining Stage 4 relationships in shared order: Specialty Material inputs; local Textile Workshop exchange; Amphitheater/Wonder population exchange; domestic trade exchange; Stage Manager establishment. Transaction effects granted to another city, including the trade-route origin Amenity, remain explicit."
          - "Industry and Corporation Specialty Material sub-bullets appear only through the Monopolies_Mode text action; the always-loaded Fashion House description contains only the standard-improvement line."
          - "The Fashion House Civilopedia page matches the Café's format and breadth: exactly one Supply Chains title/paragraph followed by one Historical Context title with three history paragraphs, and no Civilopedia Description chapter."
          - "Fashion House Supply Chains prose follows workshop cloth plus improved Specialty Materials into fashionable goods for Amphitheaters and the three named Wonders; its history separately covers the emergence of fashion houses, specialty materials and status, and the relationship between dress, performance, and civic display."
          - "ICON_BUILDING_CSC_TAILORS_FASHION_HOUSE uses the Tailors atlas index 6, and Icons/CSC_TAILORS_ICONS.sql is Content loaded by the shared UpdateIcons action."
        runtime_scenarios:
          - "Verify local/specialist effects and cities at radii 5, 6, and 7; inspect the Fashion House icon, complete description, and all Civilopedia history paragraphs."

      - id: I.STAGE4_SPEC_INPUT
        design_refs: [material_improvements.D.MATERIAL.SPECIALTY, buildings.D.STAGE4.effects.D.STAGE4.SPEC_INPUT]
        gameplay_patterns: [GP.MATERIAL.BUILDING_FROM_IMPROVEMENT, GP.MC.MATERIAL_TOTALS]
        localization_patterns: [LP.MATERIAL.BULLET, LP.MC.SUB_BULLET]
        outputs: [core, monopolies, localization_source]
        static_assertions:
          - "Culture totals are standard 1, Industry 2, Corporation 3."
        runtime_scenarios:
          - "Test Specialty standard improvement, Industry, and Corporation; Base gives no Culture."

      - id: I.STAGE4_POP_CUSTOMERS
        design_refs: [buildings.D.STAGE4.effects.D.STAGE4.POP_CUSTOMERS]
        gameplay_patterns: [GP.BUILDING.CUSTOMER_TRANSACTION, GP.SCALING.PER_N_POPULATION_INTEGER, GP.REPLACEMENT.DIRECT_ONE_LEVEL]
        localization_patterns: [LP.CUSTOMER.BILATERAL_BULLET, LP.PEDIA.CUSTOMER_APPEND]
        outputs: [core, gold, localization_source]
        static_assertions:
          - "Per floor(population/5): customer +1 Culture; Fashion House +1 Production/+1 Gold."
          - "Amphitheater and all three named Wonders are covered."
          - "Amphitheater replacements inherit their building-yield effect and are explicitly included once in Lua lookup and text; named Wonders are never expanded."
          - "Amphitheater and each named Wonder page retain one integrated Supply Chains section describing the Fashion House exchange; Amphitheater and Theater Square entries also carry the concise Stage Manager pointer required by I.STAGE_MANAGER."
        replacement_binding:
          amphitheater_presence_requirement: engine_inherited
          amphitheater_building_yield_effect: engine_inherited
          customer_population_Lua_lookup: explicit_direct_one_level
          amphitheater_description_append: explicit_direct_one_level
          named_wonders: never_expand
        runtime_scenarios:
          - "Test every customer at populations 4, 5, 9, 10, including direct replacements."

      - id: I.STAGE_MANAGER
        design_refs: [buildings.D.STAGE4.effects.D.STAGE4.SERVICE, art.properties.D.ART.STAGE4.CUSTOMERS]
        gameplay_patterns: [GP.SERVICE.HIDDEN_BUILDING, GP.SERVICE.EFFECTS, GP.SERVICE.PRESENTATION_ANCHOR, GP.SERVICE.WONDER_HOSTED_EXACT_PLACEMENT, GP.REPLACEMENT.DIRECT_ONE_LEVEL]
        localization_patterns: [LP.SERVICE.INTRO, LP.SERVICE.EFFECT, LP.PEDIA.SERVICE_CHAPTERS, LP.PEDIA.CUSTOMER_APPEND, LP.CIVIC.APPEND, LP.NOTIFICATION.SERVICE_STATE]
        outputs: [core, localization_source, icons, wonder_service_gameplay, wonder_service_city_breakdown, wonder_service_plot_tooltip_base, wonder_service_plot_tooltip_suk]
        static_assertions:
          - "Requires Opera and Ballet plus supplied BASE and SPEC."
          - "The normal Stage Manager uses the persistent SQL-grant path and is established in a Theater Square with an Amphitheater."
          - "Bolshoi Theatre, Broadway, and Sydney Opera House each map to a distinct internal Stage Manager building type and activation property; their visible name, icon, and effects are shared."
          - "Wonder-hosted variants have PrereqDistrict=DISTRICT_WONDER, MustPurchase=1, and CitizenSlots=0. They are never created by a SQL grant modifier."
          - "The shared deterministic gameplay reconciler creates each Wonder variant with CityBuildQueue.CreateBuilding(buildingIndex, hostWonderPlotIndex), preserves a correct instance, relocates a misplaced instance, creates a missing persistent instance after activation, and removes an orphan whose host Wonder no longer exists."
          - "Every destination gets +10% Culture and +1 Artist point. Only the Theater Square variant gets the usable +1 Citizen slot; Wonder districts cannot assign Citizens."
          - "City Breakdown scans actual district-plot building lists and nests each Wonder-hosted Stage Manager beneath the Wonder on the same stored plot. Base and Sukritact plot tooltips list the actual buildings at that plot. No UI path spoofs a desired location."
          - "Exactly one mechanically real Stage Manager attach/effect pair is the MCUIS presentation anchor across its destination variants; one aggregate preview and NEW/INCREASED/DECREASED/REMOVED notification family describes the complete live ability without multiplying mechanics."
          - "ICON_BUILDING_CSC_TAILORS_STAGE_4_SERVICE uses Tailors atlas index 10 and is the MCUIS/notification icon target."
          - "The Stage Manager Civilopedia page has exactly one Supply Chains chapter and one Historical Context chapter, with no separate Description chapter."
          - "Its Supply Chains entry follows the service-page structure while integrating both destinations: the Fashion House draws on workshop cloth and improved Specialty Materials, creates performance dress for Amphitheaters and named Wonders, then after one paragraph break explains that the Theater Square post employs a Citizen while every destination advances Culture and Great Artist development."
          - "Its Historical Context entry explains the coordination of costumes, performers, scenery, schedules, and venues that made theatrical production an enduring urban profession."
          - "CSC retains the complete Stage Manager activation requirement set for optional consumers. Any later CSC_TAILORS_STAGE_4_CUSTOMERS property modifier, building attachment, Lua mirror, GamePropertyRanges entry, selection rule, and alternate model belong to the optional CSC Art Pack; none are core Tailors outputs."
          - "The Theater Square, Amphitheater, and direct one-level replacements keep one integrated Supply Chains section with the Stage Manager pointer; Bolshoi Theatre, Broadway, and Sydney Opera House each receive equivalent named-Wonder prose without replacement expansion."
          - "Opera and Ballet description composition uses the bare service text only for NULL/empty base descriptions and a `[NEWLINE][NEWLINE]`-prefixed variant when visible base text exists."
        replacement_binding:
          theater_destination_requirement: engine_inherited
          amphitheater_presence_requirement: engine_inherited
          theater_and_amphitheater_description_appends: explicit_direct_one_level
          named_wonders: never_expand
          service_buildings: never_expand
        wonder_service_binding:
          normal_destination:
            service_building_type: BUILDING_CSC_TAILORS_STAGE_4_SERVICE
            district_type: DISTRICT_THEATER
            customer_building_type: BUILDING_AMPHITHEATER
            placement_method: persistent_sql_grant
            citizen_slots: 1
          wonder_variants:
            - host_wonder_type: BUILDING_BOLSHOI_THEATRE
              service_building_type: BUILDING_CSC_TAILORS_STAGE_4_SERVICE_BOLSHOI
              activation_property: CSC_TAILORS_STAGE_4_SERVICE_BOLSHOI_READY
            - host_wonder_type: BUILDING_BROADWAY
              service_building_type: BUILDING_CSC_TAILORS_STAGE_4_SERVICE_BROADWAY
              activation_property: CSC_TAILORS_STAGE_4_SERVICE_BROADWAY_READY
            - host_wonder_type: BUILDING_SYDNEY_OPERA_HOUSE
              service_building_type: BUILDING_CSC_TAILORS_STAGE_4_SERVICE_SYDNEY
              activation_property: CSC_TAILORS_STAGE_4_SERVICE_SYDNEY_READY
          placement:
            method: gameplay_lua_exact_plot_reconciler
            output: wonder_service_gameplay
            building_prereq_district: DISTRICT_WONDER
            wonder_citizen_slots: 0
            sql_grant_modifier: false
            create_api: CityBuildQueue.CreateBuilding(buildingIndex, plotIndex)
            gameplay_location_api: CityBuildings.GetBuildingLocation
            persistent_after_activation: true
            relocate_misplaced: true
            remove_orphans: true
            deterministic: true
            refresh_events: [INITIALIZE, Events.LoadScreenClose, Events.WonderCompleted, Events.PlayerTurnActivated]
          ui:
            city_breakdown: actual_plot_nested_under_host_wonder
            plot_tooltip: actual_buildings_at_location
            location_api: CityBuildings.GetBuildingsAtLocation
            spoof_location: false
            city_breakdown_output: wonder_service_city_breakdown
            base_plot_tooltip_output: wonder_service_plot_tooltip_base
            suk_plot_tooltip_output: wonder_service_plot_tooltip_suk
        runtime_scenarios:
          - "Prove both material gates and the normal Theater Square destination; verify the usable Citizen slot, one MCUIS icon/notification stream, and all Stage Manager pedia integrations."
          - "Build Bolshoi Theatre, Broadway, and Sydney Opera House in different orders in one city. Each eligible Wonder must receive exactly its own internal Stage Manager on the same plot, with no first-Wonder capture and no Citizen slot."
          - "Save/reload and advance a turn. The reconciler must keep correct locations, repair deliberately misplaced legacy instances, and remain deterministic. City Breakdown and both supported plot-tooltip paths must show only the actual co-located Service under/on its host Wonder."

      - id: I.STAGE4_TRADE
        design_refs: [buildings.D.STAGE4.effects.D.STAGE4.TRADE]
        gameplay_patterns: [GP.TRADE.DOMESTIC_SUPPLY, GP.TRADE.CITY_YIELD_PRESENTATION]
        localization_patterns: [LP.TRADE.DOMESTIC_BULLET]
        outputs: [core, gold, localization_source, trade_route_yield_presentation_suk, trade_route_yield_tooltip_suk]
        static_assertions:
          - "Destination +1 Culture; origin Quarter +1 Production/+1 Gold only without Tailors; origin +1 Amenity."
          - "The Fashion House contributes one complete route transaction and stacks additively with the Tailor transaction."
          - "The Fashion House origin Culture modifier receives its own explicit presentation-registry row; when Tailor and Fashion House transactions both apply, their active registry entries add under Outgoing Trade Routes."
        trade_route_yield_presentation:
          registry_table: CSC_TradeRouteYieldPresentation
          registry_output: trade_route_yield_presentation_suk
          ui_output: trade_route_yield_tooltip_suk
          entries:
            - entry_id: CSC_TAILORS_IMPORT_SPECIALTY_CULTURE
              quarter_key: TAILORS
              modifier_id: MOD_CSC_TAILORS_IMPORT_FASHION_HOUSE_CULTURE
              property_name: CSC_TAILORS_IMPORT_FASHION_HOUSE_ROUTE
              property_scope: CITY_CENTER_PLOT
              yield_type: YIELD_CULTURE
              amount: 1
              display_bucket: OUTGOING_TRADE_ROUTES
        runtime_scenarios:
          - "Compare Stage 3 only, Stage 4 only, and both buildings to confirm designed stacking; with Simple UI Adjustments active, Culture is reclassified as +1, +1, and +2 Outgoing Trade Routes respectively."

  - id: compatibility
    purpose: Conditional integrations retained or rebuilt outside core.
    requirements:
      - id: I.CITY_LIGHTS
        design_refs:
          - district.effects.D.DISTRICT.CL_RURAL_WORKFORCE
          - district.effects.D.DISTRICT.CL_URBAN_GOODS_SALES
        gameplay_patterns: [GP.DISTRICT.BILATERAL_ADJACENCY]
        localization_patterns: [LP.DISTRICT.BILATERAL_BULLET, LP.PEDIA.DISTRICT_CHAPTERS, LP.PEDIA.SALES_DISTRICT_APPEND]
        outputs: [city_lights_gameplay, city_lights_localization_source, city_lights_localization_generated]
        static_assertions:
          - "Rows load only with City Lights."
          - "Rural workforce: Tailors +1 Production/provider +1 Culture; Urban goods sales: Tailors +1 Gold/customer +1 Culture."
          - "Every Rural Community type has CLASS_CSC_TAILORS_GOODS_PROVIDER and CLASS_CSC_TAILORS_SALES_CULTURE exactly once."
          - "CLASS_CSC_TAILORS_GOODS_PROVIDER is registered in Ruivo_CAO with Name=LOC_CLASS_CSC_GOODS_PROVIDER_NAME and ArtdefOverlayEntry=CSC_Goods_Provider, matching Bakers, so adjacency tooltips render Rural Community instead of the raw class identifier."
          - "Every Urban Borough type has CLASS_CSC_TAILORS_SALES and CLASS_CSC_TAILORS_SALES_CULTURE exactly once."
          - "Every participating Quarter pedia page lists all Rural Community variants once under Goods Providers and all Urban Borough variants once under Sales Districts; currently this is required for both Bakers and Tailors."
          - "Every Rural Community and Urban Borough pedia page has exactly one integrated Supply Chains title and one prose entry for the district's aggregate relationship with all Quarters, never one entry per Quarter."
          - "Rural Community prose presents the district family as a goods and workforce provider; Urban Borough prose presents the district family as an urban sales target. Each uses an evocative sentence followed by a separate precise adjacency-and-return sentence and does not hard-code the current Quarter roster."
          - "Rural descriptions append exactly `[NEWLINE][NEWLINE]Yield bonus from Quarters, and+1 [ICON_Production] Production in return.`"
          - "Urban descriptions append exactly `[NEWLINE][NEWLINE]Yield bonus from Quarters, and+1 [ICON_Gold] Gold in return.`"
          - "Bakers and Tailors composed district descriptions follow the shared canonical UI order even though tailors.md and bakers.md keep their optional interactions together: terrain/river, Materials, Rural Community when City Lights is active, then sales districts grouped by stage and returned yield."
          - "For Bakers, Urban Borough joins the Stage 2 City Center/Commercial Hub Food-return bullet; the Culture-return Entertainment Complex/Water Park/Garden group remains separate. For Tailors, Harbor remains the distinct Stage 2 Production-return bullet, while Urban Borough joins the Stage 3/4 Commercial Hub/Holy Site/Theater Square Culture-return bullet."
          - "The City Lights UpdateText patch inserts each Rural Community bullet immediately after Materials and merges Urban Borough into its matching returned-yield sales group; it never appends either interaction at the end merely because the public docs group City Lights content there."
          - "Description patches follow City Lights' actual Description-key aliases: Venice 01 reuses LOC_DISTRICT_COREEXPANSIONA_DESCRIPTION and Venice 02 reuses LOC_DISTRICT_COREEXPANSIONB_DESCRIPTION; no invented Venice description keys are targeted."
          - "The City Lights gameplay and text actions both require ModSupport_CL, and both generated files are packaged as Content."
        runtime_scenarios:
          - "Test Rural and Urban adjacency with City Lights enabled and absence with it disabled; inspect Bakers and Tailors pedia lists and confirm each City Lights district page shows one integrated Supply Chains section."

      - id: I.PRESERVED_RESOURCE_MODSUPPORT
        design_refs: [materials.base.optional, materials.specialty.optional]
        gameplay_patterns: [GP.MODSUPPORT.RESOURCE_CLASS_MAPPING]
        localization_patterns: [LP.PEDIA.RESOURCE_REVERSE_APPEND]
        outputs: [hemp_localization_source, hemp_localization_generated, llamas_localization_source, llamas_localization_generated, r2_localization_source, r2_localization_generated, cashmere_localization_source, cashmere_localization_generated, sukritact_gold_localization_source, sukritact_gold_localization_generated]
        preserved_input_refs: [MS.CH.HEMP, MS.LAR.LLAMAS, MS.R2.BAMBOO, MS.R2.GOLD, MS.R2.CASHMERE, MS.SR.GOLD]
        static_assertions:
          - "Every preserved file still contains its exact resource-to-class mapping."
          - "Hemp, Llamas and Bamboo appear once in the Tailors Base Materials list; Cashmere and the active Gold resource appear once in Specialty Materials."
          - "Hemp, Llamas, Bamboo, Cashmere, Resourceful 2 Gold, and Sukritact Gold each receive one reciprocal Supply Chains chapter under the same criteria as their gameplay mapping."
          - "Each conditional mapping binds gameplay file, generated localization file, UpdateText action, criteria, Content entry, Quarter-side entry, and reciprocal resource entry; validation fails if any member is absent or differs."
          - "Llamas and Cashmere text additionally require CSC_INCLUDE_ANIMAL_RESOURCES=1, exactly matching their gameplay actions."
        runtime_scenarios:
          - "Run one resource classification check per supported optional mod."
          - "For every enabled optional mapping, Modding.log must contain `LocalizedText - Loading <declared generated file>` immediately within that UpdateText component; `Applying Component` without a file-load line is a failed packaging/load test."

  - id: localization_and_integration
    purpose: Complete text, wiring, static validation, and game validation.
    requirements:
      - id: I.LOCALIZATION_COMPLETE
        design_refs: [identity, district, material_improvements, buildings]
        gameplay_patterns: [GP.REPLACEMENT.DIRECT_ONE_LEVEL]
        localization_patterns:
