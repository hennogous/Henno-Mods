resolved_engine_decisions:
  - id: E.DECIMAL_POPULATION
    affects: I.STAGE3_POP_CUSTOMERS
    resolution: "Use the Bakers direct customer-side per-population modifier and extend the shared customer-population Lua/property-bit bridge for the cross-city Tailor returns. Preserve the Bakers 0.105 engine amount while presenting the designed 0.1 value."
    evidence:
      - Civ Supply Chains/Data/CSC_Q_BAKERS.sql
      - Civ Supply Chains/Data/CSC_Q_BAKERS_GOLD.sql
      - Civ Supply Chains/Lua_UI/CustomerPopulationReturns/CSC_CustomerPopulationReturns.lua

  - id: E.TRADE_STACKING
    affects: [I.STAGE3_TRADE, I.STAGE4_TRADE]
    resolution: "Yes. Tailor and Fashion House each contribute their complete trade-route transaction independently; when both apply to the same eligible route, their route bonuses and paired returns stack additively."
    decided_by: user

  - id: E.SERVICE_PERSISTENCE
    affects: [I.DOCKMASTER, I.SACRISTAN, I.STAGE_MANAGER]
    resolution: "For a conventional destination district, follow Bakers: MODIFIER_SINGLE_CITY_GRANT_BUILDING_IN_CITY_IGNORE grants a persistent hidden service building. Separately attached effect and Great Person modifiers keep their prerequisite requirement sets, so they deactivate and reactivate as requirements change. Intrinsic fields on the granted service building, including its Citizen slot, persist with the building. Wonder-hosted variants preserve the same one-way establishment semantics through the exact-plot reconciler recorded by E.WONDER_SERVICE_EXACT_PLACEMENT."
    decided_by: user
    evidence:
      - Civ Supply Chains/Data/CSC_Q_BAKERS.sql

  - id: E.WONDER_SERVICE_EXACT_PLACEMENT
    affects: I.STAGE_MANAGER
    resolution: "A Service whose customer is a Wonder is represented by one distinct internal hidden building type per eligible Wonder, hosted directly in DISTRICT_WONDER with no Citizen slot. SQL grant modifiers are forbidden for these variants because they choose the city's first Wonder district. A deterministic gameplay reconciler instead creates each variant on its mapped Wonder's exact stored plot, repairs misplaced legacy instances, and removes orphans. City Breakdown and plot tooltips report the actual stored plot and never spoof location. The normal Amphitheater destination remains a conventional persistent SQL-granted Service with its Citizen slot."
    decided_by: user
    evidence:
      - project/tests/wonder-service-hosting-spike/README.md
      - project/tests/wonder-service-hosting-spike/Scripts/CSC_WonderServiceHostingSpike.lua
      - project/tests/wonder-service-hosting-spike/UI/CSC_WonderServiceCityBreakdown.lua
      - project/tests/wonder-service-hosting-spike/verify_spike.py

