# Tailors' Quarter art implementation contract.
#
# This file answers: "For a selected phase, what art/SV/icon scaffold is
# allowed, what source entries are cloned, and how is the result validated?"
# Quarter design values live in project/specs/tailors/tailors-design.yaml.

schema_version: 1
schema: csc-quarter-art-implementation
status: draft_standard
design_spec: project/specs/tailors/tailors-design.yaml

metadata:
  quarter_key: TAILORS
  district_type: DISTRICT_CSC_TAILORS_QUARTER
  source_quarter_key: BAKERS
  source_district_type: DISTRICT_CSC_BAKERS_QUARTER
  tint_color_rgb: [114, 51, 168]
  current_scripts:
    - project/tools/art/scaffold_tailors_3d_art.py
    - project/tools/art/scaffold_tailors_3d_assets.py

paths:
  artdefs:
    districts: Civ Supply Chains/ArtDefs/CSC_Districts.artdef
    buildings: Civ Supply Chains/ArtDefs/CSC_Buildings.artdef
    landmarks: Civ Supply Chains/ArtDefs/CSC_Landmarks.artdef
    strategic_view: Civ Supply Chains/ArtDefs/CSC_StrategicView.artdef
  folders:
    assets: Civ Supply Chains/Assets
    materials: Civ Supply Chains/Materials
    textures: Civ Supply Chains/Textures
    xlps: Civ Supply Chains/XLPs
  xlp:
    tilebases: Civ Supply Chains/XLPs/CSC_Tilebases.xlp
    strategic_view: Civ Supply Chains/XLPs/CSC_StrategicView.xlp
    icons: Civ Supply Chains/XLPs/CSC_Icons.xlp
  asset_cloud_cache: "%APPDATA%/AssetCloud/mod-Civ Supply Chains-asset-deps.json"

global_clone_rules:
  # This is the big scaffold lesson: clone named direct children from known root
  # collections. Do not do a global string clone of Bakers blocks.
  # ArtDefs and XLPs are shared aggregate files. Treat them as append/merge
  # targets, never as files to regenerate from only the current Quarter's data.
  clone_listed_nodes_only: true
  clone_direct_children_only: true
  append_to_existing_aggregate_files: true
  never_replace_whole_artdef_or_xlp: true
  preserve_unknown_siblings: true
  preserve_source_quarter_entries: true
  preserve_source_order: true
  require_idempotence: true
  preflight_required_existing_refs:
    - CSC_BAKERS
    - CSC_BAKERS_Pillaged
    - CSC_BAKERS_UnderConstruction
    - CSC_BAKERS_Wind_Mill
    - CSC_BAKERS_Bakery
    - CSC_BAKERS_Cafe
    - CSC_BAKERS_Water_Mill
  reject_leftover_source_refs:
    - CSC_BAKERS_Flour
    - IMP_Cree_Mekewap_Mill
  replacement_order:
    # Specific object mappings first; broad quarter mappings last.
    - {from: BUILDING_CSC_BAKERS_WIND_MILL, to: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP}
    - {from: BUILDING_CSC_BAKERS_BAKERY, to: BUILDING_CSC_TAILORS_TAILOR}
    - {from: BUILDING_CSC_BAKERS_CAFE, to: BUILDING_CSC_TAILORS_FASHION_HOUSE}
    - {from: CSC_BAKERS_Wind_Mill, to: CSC_TAILORS_Textile_Workshop}
    - {from: CSC_BAKERS_Bakery, to: CSC_TAILORS_Tailor}
    - {from: CSC_BAKERS_Cafe, to: CSC_TAILORS_Fashion_House}
    - {from: CSC_Atlas_B_BAKERS, to: CSC_Atlas_B_TAILORS}
    - {from: CSC_BAKERS, to: CSC_TAILORS}
    - {from: BAKERS, to: TAILORS}
    - {from: Bakers, to: Tailors}

phase_contracts:
  phase_2_district_art:
    status: implemented
    objective: Create only the district/base art needed for the Phase 2 playable district slice.
    allowed_files:
      - Civ Supply Chains/ArtDefs/CSC_Districts.artdef
      - Civ Supply Chains/ArtDefs/CSC_Landmarks.artdef
      - Civ Supply Chains/ArtDefs/CSC_StrategicView.artdef
      - Civ Supply Chains/Assets/CSC_TAILORS_Ancient_Base_01.ast
      - Civ Supply Chains/Assets/CSC_TAILORS_Classical_Base_01.ast
      - Civ Supply Chains/Assets/CSC_TAILORS_Well.ast
      - Civ Supply Chains/Assets/CSC_TAILORS_Storage_S.ast
      - Civ Supply Chains/Assets/CSC_TAILORS_Storage_M.ast
      - Civ Supply Chains/Assets/CSC_TAILORS_Storage_L.ast
      - Civ Supply Chains/Materials/CSC_TAILORS_E.mtl
      - Civ Supply Chains/Materials/CSC_TAILORS_NE.mtl
      - Civ Supply Chains/Materials/CSC_TAILORS_Well.mtl
      - Civ Supply Chains/XLPs/CSC_Tilebases.xlp
      - "%APPDATA%/AssetCloud/mod-Civ Supply Chains-asset-deps.json"
    forbidden_files:
      - Civ Supply Chains/Assets/CSC_TAILORS_Classical_Base_02.ast
      - Civ Supply Chains/Assets/CSC_TAILORS_Classical_Base_03.ast
      - Civ Supply Chains/Assets/CSC_TAILORS_Classical_Base_04.ast
      - Civ Supply Chains/Assets/CSC_TAILORS_Classical_Base_05.ast
      - Civ Supply Chains/ArtDefs/CSC_Buildings.artdef
      - Civ Supply Chains/Assets/CSC_TAILORS_Textile_Workshop.ast
      - Civ Supply Chains/Assets/CSC_TAILORS_Textile_Workshop_2.ast
      - Civ Supply Chains/Assets/CSC_TAILORS_Tailor.ast
      - Civ Supply Chains/Assets/CSC_TAILORS_Fashion_House.ast
    artdef_clones:
      - file: Civ Supply Chains/ArtDefs/CSC_Districts.artdef
        root_collection: District
        source: DISTRICT_CSC_BAKERS_QUARTER
        target: DISTRICT_CSC_TAILORS_QUARTER
      - file: Civ Supply Chains/ArtDefs/CSC_StrategicView.artdef
        root_collections:
          - DistrictEntries
          - Districts
        sources:
          - CSC_BAKERS
          - CSC_BAKERS_Pillaged
          - CSC_BAKERS_UnderConstruction
        targets:
          - CSC_TAILORS
          - CSC_TAILORS_Pillaged
          - CSC_TAILORS_UnderConstruction
      - file: Civ Supply Chains/ArtDefs/CSC_Landmarks.artdef
        root_collection: Districts
        source: DISTRICT_CSC_BAKERS_QUARTER
        target: DISTRICT_CSC_TAILORS_QUARTER
        keep_base_variants:
          - {source: "01 Ancient: Empty", target: "01 Ancient: Empty"}
          - {source: "02 Classical: Empty", target: "02 Classical: Empty"}
          - {source: "03 Classical: B1", target: "03 Classical: Textile Workshop"}
          - {source: "04 Classical: B1, B2", target: "04 Classical: Textile Workshop, Tailor"}
          - {source: "05 Classical: B1, B3", target: "05 Classical: Textile Workshop, Fashion House"}
          - {source: "06 Classical: B1, B2, B3", target: "06 Classical: Textile Workshop, Tailor, Fashion House"}
    asset_clones:
      materials:
        - {source: CSC_BAKERS_E, target: CSC_TAILORS_E}
        - {source: CSC_BAKERS_NE, target: CSC_TAILORS_NE}
        - {source: CSC_BAKERS_Well, target: CSC_TAILORS_Well}
      bases:
        - {source: CSC_BAKERS_Ancient_Base_01, target: CSC_TAILORS_Ancient_Base_01}
        - {source: CSC_BAKERS_Classical_Base_01, target: CSC_TAILORS_Classical_Base_01}
      support:
        - {source: CSC_BAKERS_Well, target: CSC_TAILORS_Well}
        - {source: CSC_BAKERS_Storage_S, target: CSC_TAILORS_Storage_S}
        - {source: CSC_BAKERS_Storage_M, target: CSC_TAILORS_Storage_M}
        - {source: CSC_BAKERS_Storage_L, target: CSC_TAILORS_Storage_L}
      pruning:
        remove_attachment_refs:
          - CSC_BAKERS_Flour
          - IMP_Cree_Mekewap_Mill
        storage_keep_attachment_points:
          CSC_TAILORS_Storage_S:
            - newAttachmentPoint_1
            - newAttachmentPoint_9
            - newAttachmentPoint_10
            - newAttachmentPoint_11
          CSC_TAILORS_Storage_M:
            - newAttachmentPoint_1
            - newAttachmentPoint_2
            - newAttachmentPoint_14
            - newAttachmentPoint_15
          CSC_TAILORS_Storage_L:
            - newAttachmentPoint_1
            - newAttachmentPoint_2
            - newAttachmentPoint_3
            - newAttachmentPoint_42
            - newAttachmentPoint_43
    verify:
      - XML parses for touched ArtDefs, ASTs, MTLs, and XLPs.
      - Scaffold rerun is idempotent.
      - Existing Bakers ArtDef/XLP entries remain present after Tailors entries are added.
      - Tailors district/base entries have no forbidden Bakers-only refs.
      - XLP entries exist for every generated AST.
      - AssetCloud cache mirrors generated AST/material files when available.
      - In-game district renders in world view and Strategic View.

  phase_3_textile_workshop_art:
    status: prescaffolded
    objective: Add or validate the Textile Workshop visual scaffold with building ArtDef and SV entries.
    allowed_files:
      - Civ Supply Chains/ArtDefs/CSC_Buildings.artdef
      - Civ Supply Chains/ArtDefs/CSC_Landmarks.artdef
      - Civ Supply Chains/ArtDefs/CSC_StrategicView.artdef
      - Civ Supply Chains/Assets/CSC_TAILORS_Textile_Workshop.ast
      - Civ Supply Chains/XLPs/CSC_Tilebases.xlp
      - Civ Supply Chains/Lua_UI/ArtProperties/CSC_ArtProperties.lua
      - "%APPDATA%/AssetCloud/mod-Civ Supply Chains-asset-deps.json"
    artdef_clones:
      building:
        file: Civ Supply Chains/ArtDefs/CSC_Buildings.artdef
        root_collection: Building
        source: BUILDING_CSC_BAKERS_WIND_MILL
        target: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
      strategic_view:
        file: Civ Supply Chains/ArtDefs/CSC_StrategicView.artdef
        root_collections:
          - BuildingEntries
          - Buildings
        entries:
          - {source: CSC_BAKERS_Wind_Mill, target: CSC_TAILORS_Textile_Workshop}
          - {source: CSC_BAKERS_Wind_Mill_Pillaged, target: CSC_TAILORS_Textile_Workshop_Pillaged}
          - {source: CSC_BAKERS_Wind_Mill_UnderConstruction, target: CSC_TAILORS_Textile_Workshop_UnderConstruction}
    asset_clones:
      - {source: CSC_BAKERS_Wind_Mill, target: CSC_TAILORS_Textile_Workshop}
    manual_followup:
      - Confirm Textile Workshop geometry identity.
      - Add fabric/textile props after scaffold is stable.
    customer_art_bridge:
      required: true
      source_property: CSC_TAILORS_STAGE_2_LIGHTHOUSE
      art_property: CSC_TAILORS_STAGE_2_LIGHTHOUSE_ART
      trigger: Adjacent same-player Harbor with a functioning Lighthouse or direct Lighthouse replacement.
      display_requirement: Reveal an active-customer Textile Workshop landmark state that is visually distinct from the ordinary Textile Workshop-only state.
      separation_rule: This state represents the Lighthouse customer transaction, not Naval Tradition or the Sailmaker service.
    verify:
      - Textile Workshop appears when built.
      - Base variant changes from empty state to Textile Workshop state.
      - Strategic View completed, pillaged, and under-construction states resolve.
      - Active Lighthouse-customer state resolves in world view without requiring Naval Tradition.
      - Removing or pillaging the qualifying Lighthouse removes the active-customer state.

  phase_4_tailor_art:
    status: prescaffolded
    objective: Add or validate the Tailor visual scaffold.
    allowed_files:
      - Civ Supply Chains/ArtDefs/CSC_Buildings.artdef
      - Civ Supply Chains/ArtDefs/CSC_Landmarks.artdef
      - Civ Supply Chains/ArtDefs/CSC_StrategicView.artdef
      - Civ Supply Chains/Assets/CSC_TAILORS_Tailor.ast
      - Civ Supply Chains/XLPs/CSC_Tilebases.xlp
      - "%APPDATA%/AssetCloud/mod-Civ Supply Chains-asset-deps.json"
    artdef_clones:
      building:
        file: Civ Supply Chains/ArtDefs/CSC_Buildings.artdef
        root_collection: Building
        source: BUILDING_CSC_BAKERS_BAKERY
        target: BUILDING_CSC_TAILORS_TAILOR
      strategic_view:
        file: Civ Supply Chains/ArtDefs/CSC_StrategicView.artdef
        root_collections:
          - BuildingEntries
          - Buildings
        entries:
          - {source: CSC_BAKERS_Bakery, target: CSC_TAILORS_Tailor}
          - {source: CSC_BAKERS_Bakery_Pillaged, target: CSC_TAILORS_Tailor_Pillaged}
          - {source: CSC_BAKERS_Bakery_UnderConstruction, target: CSC_TAILORS_Tailor_UnderConstruction}
    asset_clones:
      - {source: CSC_BAKERS_Bakery, target: CSC_TAILORS_Tailor}
    verify:
      - Tailor appears when built.
      - Combined Textile Workshop + Tailor base variant resolves.

  phase_5_fashion_house_art:
    status: prescaffolded
    objective: Add or validate the Fashion House visual scaffold.
    allowed_files:
      - Civ Supply Chains/ArtDefs/CSC_Buildings.artdef
      - Civ Supply Chains/ArtDefs/CSC_Landmarks.artdef
      - Civ Supply Chains/ArtDefs/CSC_StrategicView.artdef
      - Civ Supply Chains/Assets/CSC_TAILORS_Fashion_House.ast
      - Civ Supply Chains/XLPs/CSC_Tilebases.xlp
      - "%APPDATA%/AssetCloud/mod-Civ Supply Chains-asset-deps.json"
    artdef_clones:
      building:
        file: Civ Supply Chains/ArtDefs/CSC_Buildings.artdef
        root_collection: Building
        source: BUILDING_CSC_BAKERS_CAFE
        target: BUILDING_CSC_TAILORS_FASHION_HOUSE
      strategic_view:
        file: Civ Supply Chains/ArtDefs/CSC_StrategicView.artdef
        root_collections:
          - BuildingEntries
          - Buildings
        entries:
          - {source: CSC_BAKERS_Cafe, target: CSC_TAILORS_Fashion_House}
          - {source: CSC_BAKERS_Cafe_Pillaged, target: CSC_TAILORS_Fashion_House_Pillaged}
          - {source: CSC_BAKERS_Cafe_UnderConstruction, target: CSC_TAILORS_Fashion_House_UnderConstruction}
    asset_clones:
      - {source: CSC_BAKERS_Cafe, target: CSC_TAILORS_Fashion_House}
    verify:
      - Fashion House appears when built.
      - All base variants resolve: Textile Workshop only, with Tailor, with Fashion House, and with both.

icon_contract:
  status: implemented_sql_assets_present
  sql_file: Civ Supply Chains/Icons/CSC_TAILORS_ICONS.sql
  atlas:
    name: ICON_ATLAS_CSC_TAILORS
    icons_per_row: 4
    icons_per_column: 4
    sizes: [256, 128, 80, 70, 50, 38, 32, 22]
  required_definitions:
    - ICON_DISTRICT_CSC_TAILORS_QUARTER
    - DISTRICT_CSC_TAILORS_QUARTER
    - TAILORS
    - ICON_DISTRICT_CSC_TAILORS_QUARTER_FOW
  verify:
    - Icon SQL loads through UpdateIcons, not UpdateDatabase.
    - Bare district alias exists for adjacency tooltip icon lookup.

art_property_bridge:
  status: planned_per_building_phase
  rule: >
    Add art-property bridge rows only when a gameplay relationship should alter
    visible district/building state. Do not gate art bridge requirements on
    service unlock civics unless the visual state itself should wait for the civic.

manual_art_owner_tasks:
  - Confirm final Textile Workshop silhouette and prop language.
  - Confirm final Tailor silhouette and prop language.
  - Confirm final Fashion House silhouette and prop language.
  - Finish Tailors texture/roof treatment.
  - Judge in-game readability after each building phase.
