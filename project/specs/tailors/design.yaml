schema_version: 1
quarter: tailors
status: transcribed
canonical_source: docs/content/quarters/tailors.md
canonical_source_sha256: 4fa09956ec75eea064b9f2f5a592a2febe4942ef7ced0ee6e9fe2537d7b75a9d
transcription_rule: >
  This file is a machine-readable transcription only. It must not resolve engine
  questions, select Bakers patterns, add replacement support, or reinterpret prose.

identity:
  name: Tailors' Quarter
  abbreviation: TAILORS
  main_yield: YIELD_CULTURE

materials:
  base:
    standard:
      - {resource: RESOURCE_COTTON, source_label: Cotton}
      - {resource: RESOURCE_SHEEP, source_label: Sheep, animal_resource: true}
    csc:
      - {resource: RESOURCE_CSC_FLAX, source_label: Flax}
    optional:
      - {resource: RESOURCE_BAMBOO, source_label: Bamboo, mod: R2}
      - {resource: RESOURCE_AOM_HEMP, source_label: Hemp, mod: CH}
      - {resource: RESOURCE_LEU_P0K_LLAMAS, source_label: Llamas, mod: LAR, animal_resource: true}
  specialty:
    standard:
      - {resource: RESOURCE_DYES, source_label: Dyes}
      - {resource: RESOURCE_SILK, source_label: Silk}
      - {resource: RESOURCE_SILVER, source_label: Silver}
    optional:
      - {resource: RESOURCE_CASHMERE, source_label: Cashmere, mod: R2, animal_resource: true}
      - {resource: RESOURCE_GOLD2, source_label: Gold, mod: R2}
      - {resource: RESOURCE_GOLD, source_label: Gold, mod: SR}

district:
  id: D.DISTRICT
  type: DISTRICT_CSC_TAILORS_QUARTER
  prerequisite: CIVIC_CRAFTSMANSHIP
  cost: 60
  maintenance_gold: 1
  effects:
    - id: D.DISTRICT.LOGISTICS
      statement: "+1 Production from every 2 adjacent river edges."
      inputs: [RIVER_EDGE]
      input_count: 2
      quarter_yields: {YIELD_PRODUCTION: 1}

    - id: D.DISTRICT.MATERIAL_INPUTS
      statement: "+1 Production from each adjacent Base or Specialty Material resource."
      inputs: [base_material_resource, specialty_material_resource]
      quarter_yields: {YIELD_PRODUCTION: 1}

    - id: D.DISTRICT.CL_RURAL_WORKFORCE
      condition: City Lights
      statement: "+1 Production from each adjacent Rural Community, and +1 Culture in return."
      workforce_provider_label: Rural Community
      provider_yields: {YIELD_CULTURE: 1}
      quarter_yields: {YIELD_PRODUCTION: 1}

    - id: D.DISTRICT.INTERMEDIARY_GOODS_CUSTOMERS
      statement: "+1 Gold from each adjacent Harbor, and +1 Production in return."
      customer_districts: [DISTRICT_HARBOR]
      customer_yields: {YIELD_PRODUCTION: 1}
      quarter_yields: {YIELD_GOLD: 1}

    - id: D.DISTRICT.GOODS_SALES_CUSTOMERS
      statement: "+1 Gold from each adjacent Commercial Hub, Holy Site and Theater Square, and +1 Culture in return."
      customer_districts: [DISTRICT_COMMERCIAL_HUB, DISTRICT_HOLY_SITE, DISTRICT_THEATER]
      customer_yields: {YIELD_CULTURE: 1}
      quarter_yields: {YIELD_GOLD: 1}

    - id: D.DISTRICT.CL_URBAN_GOODS_SALES
      condition: City Lights
      statement: "+1 Gold from each adjacent Urban Borough, and +1 Culture in return."
      customer_district_label: Urban Borough
      customer_yields: {YIELD_CULTURE: 1}
      quarter_yields: {YIELD_GOLD: 1}

material_improvements:
  - id: D.MATERIAL.BASE
    stage: 1
    class: CLASS_CSC_TAILORS_BASE
    adjacent_building: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
    standard: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
    industry_total: {YIELD_PRODUCTION: 2, YIELD_GOLD: 2}
    corporation_total: {YIELD_PRODUCTION: 3, YIELD_GOLD: 3}

  - id: D.MATERIAL.SPECIALTY
    class: CLASS_CSC_TAILORS_SPEC
    adjacent_building: BUILDING_CSC_TAILORS_FASHION_HOUSE
    standard: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
    industry_total: {YIELD_PRODUCTION: 2, YIELD_GOLD: 2}
    corporation_total: {YIELD_PRODUCTION: 3, YIELD_GOLD: 3}

buildings:
  - id: D.STAGE2
    stage: 2
    type: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
    name: Textile Workshop
    prerequisite: TECH_CONSTRUCTION
    cost: 80
    maintenance_gold: 2
    effects:
      - id: D.STAGE2.BASE_INPUT
        statement: "+1 Culture from each adjacent Base Materials improvement; Industry total 2, Corporation total 3."
        material_class: CLASS_CSC_TAILORS_BASE
        standard: {YIELD_CULTURE: 1}
        industry_total: {YIELD_CULTURE: 2}
        corporation_total: {YIELD_CULTURE: 3}

      - id: D.STAGE2.INTERMEDIARY_GOODS_CUSTOMER
        statement: "+1 Production to each adjacent Lighthouse, and +1 Production and +1 Gold to the Textile Workshop in return."
        customers: [BUILDING_LIGHTHOUSE]
        customer_yields: {YIELD_PRODUCTION: 1}
        building_yields: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}

      - id: D.STAGE2.LOCAL_CUSTOMERS
        statement: "+1 Production and +1 Gold from the local Tailor and Fashion House, providing +1 Culture to each in return."
        local_customers: [BUILDING_CSC_TAILORS_TAILOR, BUILDING_CSC_TAILORS_FASHION_HOUSE]
        local_customer_yields: {YIELD_CULTURE: 1}
        building_yields: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}

      - id: D.STAGE2.SERVICE
        unlock: CIVIC_NAVAL_TRADITION
        supplied_by: [CLASS_CSC_TAILORS_BASE]
        service: BUILDING_CSC_TAILORS_STAGE_2_SERVICE
        service_name: Dockmaster
        destination_district: DISTRICT_HARBOR
        required_customer: BUILDING_LIGHTHOUSE
        effects:
          naval_unit_production_percent: 20
          latest_era: ERA_RENAISSANCE
          citizen_slots: 1
          great_person_points: {GREAT_PERSON_CLASS_ADMIRAL: 1}

  - id: D.STAGE3
    stage: 3
    type: BUILDING_CSC_TAILORS_TAILOR
    name: Tailor
    prerequisite: CIVIC_GUILDS
    prerequisite_building: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
    cost: 160
    maintenance_gold: 2
    effects:
      - id: D.STAGE3.LOCAL
        local_supplier: [BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP]
        local_supplier_yields: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
        building_yields: {YIELD_CULTURE: 1}

      - id: D.STAGE3.SPECIALISTS
        citizen_slots: 1
        citizen_yields: {YIELD_CULTURE: 2, YIELD_GOLD: 1}

      - id: D.STAGE3.AMENITY
        city_amenities: 1

      - id: D.STAGE3.POP_CUSTOMERS
        customers: [BUILDING_TEMPLE, BUILDING_MARKET]
        per_citizen_customer_yields: {YIELD_CULTURE: 0.1}
        per_citizen_building_yields: {YIELD_PRODUCTION: 0.1, YIELD_GOLD: 0.1}

      - id: D.STAGE3.SERVICE
        unlock: CIVIC_DIVINE_RIGHT
        supplied_by: [CLASS_CSC_TAILORS_BASE]
        service: BUILDING_CSC_TAILORS_STAGE_3_SERVICE
        service_name: Sacristan
        destination_district: DISTRICT_HOLY_SITE
        required_customer: BUILDING_TEMPLE
        effects:
          city_faith_percent: 10
          citizen_slots: 1
          great_person_points: {GREAT_PERSON_CLASS_PROPHET: 1}

      - id: D.STAGE3.TRADE
        origin_yields: {YIELD_CULTURE: 1}
        destination_quarter_yields: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
        origin_requires_no_district: DISTRICT_CSC_TAILORS_QUARTER
        origin_amenities: 1

  - id: D.STAGE4
    stage: 4
    type: BUILDING_CSC_TAILORS_FASHION_HOUSE
    name: Fashion House
    prerequisite: CIVIC_HUMANISM
    prerequisite_building: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
    cost: 250
    maintenance_gold: 3
    effects:
      - id: D.STAGE4.LOCAL
        local_supplier: [BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP]
        local_supplier_yields: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
        building_yields: {YIELD_CULTURE: 1}

      - id: D.STAGE4.SPEC_INPUT
        material_class: CLASS_CSC_TAILORS_SPEC
        standard: {YIELD_CULTURE: 1}
        industry_total: {YIELD_CULTURE: 2}
        corporation_total: {YIELD_CULTURE: 3}

      - id: D.STAGE4.SPECIALISTS
        citizen_slots: 1
        citizen_yields: {YIELD_CULTURE: 1, YIELD_GOLD: 2}

      - id: D.STAGE4.REGIONAL_AMENITY
        amenities: 1
        radius: 6

      - id: D.STAGE4.POP_CUSTOMERS
        population_interval: 5
        customers:
          - BUILDING_AMPHITHEATER
          - BUILDING_BOLSHOI_THEATRE
          - BUILDING_BROADWAY
          - BUILDING_SYDNEY_OPERA_HOUSE
        customer_yields: {YIELD_CULTURE: 1}
        building_yields: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}

      - id: D.STAGE4.SERVICE
        unlock: CIVIC_OPERA_BALLET
        supplied_by: [CLASS_CSC_TAILORS_BASE, CLASS_CSC_TAILORS_SPEC]
        service: BUILDING_CSC_TAILORS_STAGE_4_SERVICE
        service_name: Stage Manager
        destinations:
          - {district: DISTRICT_THEATER, required_customer: BUILDING_AMPHITHEATER}

          - district: DISTRICT_CSC_TAILORS_QUARTER
            required_adjacent_wonders:
              any_of:
                - BUILDING_BOLSHOI_THEATRE
                - BUILDING_BROADWAY
                - BUILDING_SYDNEY_OPERA_HOUSE
        effects:
          city_culture_percent: 10
          citizen_slots: 1
          great_person_points: {GREAT_PERSON_CLASS_ARTIST: 1}

      - id: D.STAGE4.TRADE
        origin_yields: {YIELD_CULTURE: 1}
        destination_quarter_yields: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
        origin_requires_no_district: DISTRICT_CSC_TAILORS_QUARTER
        origin_amenities: 1

art:
  status: stage2_art_bridge_and_wireup_implemented
  rule: The existing Tailors art is retained. The SQL/Lua bridge exposes the supplied Textile Workshop-to-Lighthouse transaction as a binary city property; GamePropertyRanges and Landmarks select its visual variant.
  properties:
    - id: D.ART.STAGE2.LIGHTHOUSE
      source_property: CSC_TAILORS_STAGE_2_EFFECT_PRODUCTION
      effect_content: PRODUCTION
      art_property: CSC_TAILORS_STAGE_2_EFFECT_PRODUCTION_ART
      interval_property: CSC_TAILORS_STAGE_2_EFFECT_PRODUCTION_ACTIVE
      baseline_asset: CSC_TAILORS_Textile_Workshop
      triggered_asset: CSC_TAILORS_Textile_Workshop_2
      active_when: An adjacent same-owner Lighthouse serves a Tailors' Quarter with a functioning Textile Workshop and an adjacent improved Base Material.
      excludes: [CIVIC_NAVAL_TRADITION]
    - id: D.ART.STAGE3.CUSTOMERS
      source_property: CSC_TAILORS_STAGE_3_CUSTOMERS
      art_property: CSC_TAILORS_STAGE_3_CUSTOMERS_ART
      active_when: An adjacent same-owner Temple or Market serves a Tailors' Quarter with a functioning Tailor.
      excludes: [CIVIC_DIVINE_RIGHT]
    - id: D.ART.STAGE4.CUSTOMERS
      source_property: CSC_TAILORS_STAGE_4_CUSTOMERS
      art_property: CSC_TAILORS_STAGE_4_CUSTOMERS_ART
      active_when: An adjacent same-owner Amphitheater, Bolshoi Theatre, Broadway, or Sydney Opera House serves a Tailors' Quarter with a functioning Fashion House.
      excludes: [CIVIC_OPERA_BALLET]
