# Tailors' Quarter design declaration.
#
# This file is quarter design truth: identifiers, resources, stages, customers,
# services, trade-route intent, and parked scope. It should change only when the
# Tailors design changes. Implementation files should reference this file rather
# than duplicating design prose.

schema_version: 1
schema: csc-quarter-design
status: draft_standard

metadata:
  quarter_key: TAILORS
  display_name: "Tailors' Quarter"
  doc_title: "Tailors' Quarter"
  design_doc: docs/content/quarters/tailors.md
  hero_image: "docs/content/images/Civ Modding Projects - Tailors' Quarter.jpg"
  notion_playbook: "Tailors' Quarter"
  implementation_specs:
    gameplay: project/specs/tailors/tailors-gameplay.yaml
    art: project/specs/tailors/tailors-art.yaml
  localization:
    # Quarter-specific player-facing LOC rows belong in their own Markdown
    # source, then get generated into the matching SQL file for ModBuddy.
    source: project/localization/CSC_TAILORS_TEXT.md
    generated: Civ Supply Chains/Text/CSC_TAILORS_TEXT.sql
    modsupport_sources:
      City_Lights:
        source: project/localization/ModSupport_CL_TEXT.md
        generated: Civ Supply Chains/ModSupport/ModSupport_CL_TEXT.sql
    owns_loc_prefixes:
      - LOC_DISTRICT_CSC_TAILORS_
      - LOC_BUILDING_CSC_TAILORS_
      - LOC_CSC_TAILORS_

identity:
  district_type: DISTRICT_CSC_TAILORS_QUARTER
  district_name_loc: LOC_DISTRICT_CSC_TAILORS_QUARTER_NAME
  district_description_loc: LOC_DISTRICT_CSC_TAILORS_QUARTER_DESCRIPTION
  main_yield: YIELD_CULTURE
  unlock_civic: CIVIC_CRAFTSMANSHIP
  cost: 60
  maintenance_cost:
    YIELD_GOLD: 1
  tint_color_rgb: [114, 51, 168]

materials:
  base:
    tag: CLASS_CSC_TAILORS_BASE
    standard:
      - RESOURCE_COTTON
    csc_custom:
      - RESOURCE_CSC_FLAX
    animal_option:
      - RESOURCE_SHEEP
    modsupport:
      standard:
        Resourceful_2:
          - RESOURCE_BAMBOO
        Cannabis_and_Hemp:
          - RESOURCE_HEMP
      animal_option:
        Latin_American_Resources:
          - RESOURCE_LLAMA
  specialty:
    tag: CLASS_CSC_TAILORS_SPEC
    standard:
      - RESOURCE_DYES
      - RESOURCE_SILVER
    animal_option:
      - RESOURCE_SILK
    modsupport:
      standard:
        Resourceful_2:
          - RESOURCE_GOLD
        Sukritacts_Resources:
          - RESOURCE_GOLD
      animal_option:
        Resourceful_2:
          - RESOURCE_CASHMERE

district_adjacencies:
  material_resources:
    - id: tailors_base_material_production
      source_tag: CLASS_CSC_TAILORS_BASE
      quarter_receives: {YIELD_PRODUCTION: 1}
      rule: adjacent_resource_by_typetag
    - id: tailors_specialty_material_production
      source_tag: CLASS_CSC_TAILORS_SPEC
      quarter_receives: {YIELD_PRODUCTION: 1}
      rule: adjacent_resource_by_typetag
  customer_districts:
    - id: harbor_sales
      destination: DISTRICT_HARBOR
      quarter_receives: {YIELD_GOLD: 1}
      destination_receives: {YIELD_PRODUCTION: 1}
    - id: commercial_hub_sales
      destination: DISTRICT_COMMERCIAL_HUB
      quarter_receives: {YIELD_GOLD: 1}
      destination_receives: {YIELD_CULTURE: 1}
    - id: holy_site_sales
      destination: DISTRICT_HOLY_SITE
      quarter_receives: {YIELD_GOLD: 1}
      destination_receives: {YIELD_CULTURE: 1}
    - id: theater_sales
      destination: DISTRICT_THEATER
      quarter_receives: {YIELD_GOLD: 1}
      destination_receives: {YIELD_CULTURE: 1}
  terrain:
    - id: river_production
      rule: every_2_adjacent_river_edges
      quarter_receives: {YIELD_PRODUCTION: 1}
  city_lights:
    - id: rural_community
      destination_class: rural_community
      quarter_receives: {YIELD_PRODUCTION: 1}
      destination_receives: {YIELD_CULTURE: 1}
    - id: urban_borough
      destination_class: urban_borough
      quarter_receives: {YIELD_GOLD: 1}
      destination_receives: {YIELD_CULTURE: 1}

modsupport_text:
  # Standard quarter-spec pattern: every optional-mod district adjacency that
  # changes the district placement/description surface gets an explicit
  # description patch declaration here, then an UpdateText raw SQL patch in the
  # relevant ModSupport localization source.
  city_lights:
    district_description_patch:
      source: project/localization/ModSupport_CL_TEXT.md
      generated: Civ Supply Chains/ModSupport/ModSupport_CL_TEXT.sql
      target_loc: LOC_DISTRICT_CSC_TAILORS_QUARTER_DESCRIPTION
      load_criteria: ModSupport_CL
      text_action: ModSupport_CL_TEXT
      required_when:
        - CLASS_CSC_TAILORS_GOODS_PROVIDER is assigned to CL Rural Community districts.
        - CLASS_CSC_TAILORS_SALES is assigned to CL Urban Borough districts.
        - CLASS_CSC_TAILORS_SALES_CULTURE is assigned to CL Rural Community or Urban Borough districts.
      replacement_patch:
        id: add_city_lights_districts_to_sales_line
        base_fragment: "+1 [ICON_Gold] Gold from each adjacent [ICON_CSC_SALES] Commercial Hub, Holy Site, and Theater Square, and +1 [ICON_Culture] Culture in return."
        patched_fragment: "+1 [ICON_Gold] Gold from each adjacent [ICON_CSC_SALES] Commercial Hub, Holy Site, Theater Square, and Urban Borough, and +1 [ICON_Culture] Culture in return.[NEWLINE]+1 [ICON_Production] Production from each adjacent [ICON_CSC_GOODS] Rural Community, and +1 [ICON_Culture] Culture in return."
      safeguards:
        - Patch by exact text fragment so CL text composes with the base Quarter description instead of replacing the whole LOC row.
        - Include an instr(Text, 'adjacent Rural Community') = 0 guard so repeated loads do not duplicate the appended line.

stages:
  stage_2:
    key: textile_workshop
    building_type: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
    display_name: Textile Workshop
    unlock_tech: TECH_CONSTRUCTION
    cost: 80
    maintenance:
      YIELD_GOLD: -2
    material_input:
      source: adjacent_improved_base_material
      scope:
        adjacency: adjacent
        ownership: same_player
        requires_resource_tag: CLASS_CSC_TAILORS_BASE
        requires_improvement: true
        replacement_policy: not_applicable
      implementation_model:
        standard_game: core_file_grants_improvement_tier
        monopolies_and_corporations: conditional_support_file_adds_tier_delta
      building_receives:
        YIELD_CULTURE:
          improvement: 1
          industry: 2
          corporation: 3
      material_owner_receives:
        improvement: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
        industry: {YIELD_PRODUCTION: 2, YIELD_GOLD: 2}
        corporation: {YIELD_PRODUCTION: 3, YIELD_GOLD: 3}
    customers:
      - id: lighthouse
        destination_building: BUILDING_LIGHTHOUSE
        destination_district: DISTRICT_HARBOR
        scope:
          adjacency: adjacent
          ownership: same_player
          destination_requires_functioning: true
          building_replacements: direct_one_level
        destination_receives: {YIELD_PRODUCTION: 1}
        source_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
    local_exchange:
      # These links activate when the later buildings exist.
      downstream_buildings:
        - BUILDING_CSC_TAILORS_TAILOR
        - BUILDING_CSC_TAILORS_FASHION_HOUSE
      textile_workshop_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
      downstream_receives: {YIELD_CULTURE: 1}
    service:
      key: sailmaker
      hidden_building: BUILDING_CSC_TAILORS_SAILMAKER
      unlock_civic: CIVIC_NAVAL_TRADITION
      grant:
        destination_district: DISTRICT_HARBOR
        destination_building: BUILDING_LIGHTHOUSE
        scope:
          adjacency: adjacent
          ownership: same_player
          destination_requires_functioning: true
          building_replacements: direct_one_level
        cardinality: one_persistent_service_per_eligible_destination
        source_requires:
          - textile_workshop
          - adjacent_improved_base_material
      effects:
        naval_unit_production:
          percent: 20
          promotion_classes:
            - PROMOTION_CLASS_NAVAL_MELEE
            - PROMOTION_CLASS_NAVAL_RANGED
            - PROMOTION_CLASS_NAVAL_RAIDER
          eras:
            - ERA_ANCIENT
            - ERA_CLASSICAL
            - ERA_MEDIEVAL
            - ERA_RENAISSANCE
        great_person_points: {GREAT_PERSON_CLASS_ADMIRAL: 1}
      player_facing_text:
        - target: BUILDING_LIGHTHOUSE
          include_direct_replacements: true
          operation: append
          loc_key: LOC_CSC_TAILORS_SAILMAKER_EFFECT
        - target: CIVIC_NAVAL_TRADITION
          operation: append_or_set_when_empty
          loc_key: LOC_CSC_TAILORS_SAILMAKER_CIVIC

  stage_3:
    key: tailor
    building_type: BUILDING_CSC_TAILORS_TAILOR
    display_name: Tailor
    unlock_civic: CIVIC_GUILDS
    prereq_building: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
    cost: 160
    maintenance:
      YIELD_GOLD: -2
    local_effects:
      textile_workshop_exchange:
        textile_workshop_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
        tailor_receives: {YIELD_CULTURE: 1}
      citizen_slots: 1
      citizen_yields: {YIELD_CULTURE: 2, YIELD_GOLD: 1}
      city_amenities: 1
    customers:
      - id: temple
        destination_building: BUILDING_TEMPLE
        destination_district: DISTRICT_HOLY_SITE
        scaling: per_city_citizen
        destination_city_receives: {YIELD_CULTURE: 0.1}
        source_city_receives: {YIELD_PRODUCTION: 0.1, YIELD_GOLD: 0.1}
      - id: market
        destination_building: BUILDING_MARKET
        destination_district: DISTRICT_COMMERCIAL_HUB
        scaling: per_city_citizen
        destination_city_receives: {YIELD_CULTURE: 0.1}
        source_city_receives: {YIELD_PRODUCTION: 0.1, YIELD_GOLD: 0.1}
    service:
      key: robemaker
      unlock_civic: CIVIC_DIVINE_RIGHT
      destination: adjacent_holy_site_with_temple
      source_requirements:
        - tailor
        - adjacent_improved_base_material
      effects:
        faith_percent: 10
        great_person_points: {GREAT_PERSON_CLASS_PROPHET: 1}

  stage_4:
    key: fashion_house
    building_type: BUILDING_CSC_TAILORS_FASHION_HOUSE
    display_name: Fashion House
    unlock_civic: CIVIC_HUMANISM
    prereq_building: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
    cost: 250
    maintenance:
      YIELD_GOLD: -3
    material_input:
      source: adjacent_improved_specialty_material
      building_receives:
        YIELD_CULTURE:
          improvement: 1
          industry: 2
          corporation: 3
      material_owner_receives:
        improvement: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
        industry: {YIELD_PRODUCTION: 2, YIELD_GOLD: 2}
        corporation: {YIELD_PRODUCTION: 3, YIELD_GOLD: 3}
    local_effects:
      textile_workshop_exchange:
        textile_workshop_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
        fashion_house_receives: {YIELD_CULTURE: 1}
      flat_yields: {YIELD_CULTURE: 3}
      citizen_slots: 1
      citizen_yields: {YIELD_CULTURE: 1, YIELD_GOLD: 2}
      regional_amenity: {amount: 1, range: 6}
    customers:
      - id: amphitheater
        destination_building: BUILDING_AMPHITHEATER
        destination_district: DISTRICT_THEATER
        scaling: per_5_city_citizens
        destination_city_receives: {YIELD_CULTURE: 1}
        source_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
      - id: culture_wonders
        destination_buildings:
          - BUILDING_BOLSHOI_THEATRE
          - BUILDING_BROADWAY
          - BUILDING_SYDNEY_OPERA_HOUSE
        scaling: per_5_city_citizens
        destination_city_receives: {YIELD_CULTURE: 1}
        source_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
    service:
      key: couturier
      unlock_civic: CIVIC_OPERA_BALLET
      destination_options:
        - adjacent_theater_square_with_amphitheater
        - adjacent_bolshoi_theatre
        - adjacent_broadway
        - adjacent_sydney_opera_house
      source_requirements:
        - fashion_house
        - adjacent_improved_base_material
        - adjacent_improved_specialty_material
      effects:
        culture_percent: 10
        citizen_slots: 1
        wonder_established_bonus:
          great_person_points: {GREAT_PERSON_CLASS_ARTIST: 1}

trade_routes:
  source_buildings:
    - BUILDING_CSC_TAILORS_TAILOR
    - BUILDING_CSC_TAILORS_FASHION_HOUSE
  condition: origin_city_lacks_DISTRICT_CSC_TAILORS_QUARTER
  destination_city_receives: {YIELD_CULTURE: 1}
  quarter_city_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
  origin_city_receives: {AMENITY: 1}

parked_scope:
  owner_project: TaxesPolitics
  excluded_from_csc:
    - Haute Couture Product project
    - Specialty Commission project
    - Product GreatWork objects
    - Product slots
    - Aristocrat mechanics
