    allowed_files:
      - Civ Supply Chains/Lua_UI/**
      - Civ Supply Chains/Data/CSC_Q_TAILORS.sql
      - project/localization/**
      - Civ Supply Chains/Icons/CSC_TAILORS_ICONS.sql
