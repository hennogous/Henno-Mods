# Tailors' Quarter gameplay implementation contract.
#
# This file answers: "For a selected phase, what gameplay work is allowed,
# what should be produced, and how do we know it is done?"
# Quarter design values live in project/specs/tailors/tailors-design.yaml.

schema_version: 1
schema: csc-quarter-gameplay-implementation
status: draft_standard
design_spec: project/specs/tailors/tailors-design.yaml

metadata:
  quarter_key: TAILORS
  district_type: DISTRICT_CSC_TAILORS_QUARTER
  primary_sql: Civ Supply Chains/Data/CSC_Q_TAILORS.sql
  source_reference_quarter: BAKERS
  source_reference_sql:
    - Civ Supply Chains/Data/CSC_Q_BAKERS.sql
    - Civ Supply Chains/Data/CSC_Q_BAKERS_GOLD.sql
    - Civ Supply Chains/Data/CSC_Q_BAKERS_MC_MODE.sql

status_legend:
  designed: Present in design spec only.
  scaffolded: Placeholder or non-final support exists.
  partial: Some contract outputs exist, but one or more required slices are absent.
  implemented: SQL/data exists and parses.
  tested: Verified in game or with FireTuner/runtime DB.
  parked: Explicitly out of CSC scope.

global_rules:
  sql_style:
    - Use INSERT OR IGNORE for type/entity rows that may be rerun.
    - Register Types before references.
    - Reuse identical action modifiers when ModifierType and all arguments match.
    - Reuse identical requirements and requirement sets when RequirementType and all values match.
    - Keep wrappers separate when gates, text, source object, or load boundary differs.
    - Do not add duplicate ModifierArguments rows with Name='ModifierId' to one attach modifier.
  localization:
    source_dir: project/localization
    # Standard per-Quarter pattern:
    #   source:    project/localization/CSC_<QUARTER>_TEXT.md
    #   generated: Civ Supply Chains/Text/CSC_<QUARTER>_TEXT.sql
    # Keep shared/global LOC rows in shared text files, but put Quarter-owned
    # district, building, preview, and pedia text in that Quarter's own file.
    quarter_source_file: project/localization/CSC_TAILORS_TEXT.md
    quarter_generated_file: Civ Supply Chains/Text/CSC_TAILORS_TEXT.sql
    quarter_owns_loc_prefixes:
      - LOC_DISTRICT_CSC_TAILORS_
      - LOC_BUILDING_CSC_TAILORS_
      - LOC_CSC_TAILORS_
    generated_dirs:
      - Civ Supply Chains/Text
      - Civ Supply Chains/ModSupport
    rule: Edit Markdown localization sources, then regenerate/check generated SQL. Do not add new Tailors-owned LOC rows to CSC_BAKERS_TEXT.
    modsupport_rule: When optional-mod compatibility adds customer/goods-provider districts that affect a Quarter's district description, declare the text patch in the Quarter design spec under modsupport_text and implement it in the relevant ModSupport localization Markdown source. Patch by exact fragment and guard appended lines against duplication.
  modbuddy:
    source_of_truth: project/modbuddy/CivSupplyChains.actions.json
    generated_file: Civ Supply Chains/Civ Supply Chains.civ6proj
    commands:
      - py -3 project/tools/modbuddy/civ6proj_actions.py check
      - py -3 project/tools/modbuddy/civ6proj_actions.py patch
  modsupport:
    rule: Keep optional integrations additive and conditionally loaded.
    adjacency_rule: Compatibility tags may live in ModSupport, but direct Ruivo_New_Adjacency generation belongs in the shared processor.

phase_contracts:
  phase_1_design_reconciliation:
    status: complete
    objective: Align the public design, Notion plan, and implementation intent before coding.
    allowed_files:
      - docs/content/quarters/tailors.md
      - project/specs/tailors/tailors-design.yaml
      - project/specs/tailors/tailors-gameplay.yaml
      - project/specs/tailors/tailors-art.yaml
      - TaxesPolitics/docs/starter-docs.md
    forbidden_files:
      - Civ Supply Chains/Data/CSC_Q_TAILORS.sql
      - Civ Supply Chains/ArtDefs/**
    done_when:
      - Design doc has current Tailors resource, stage, service, and parked-scope decisions.
      - Parked Product/Specialty Commission ideas are outside CSC active implementation.

  phase_2_district:
    status: implemented
    objective: Make the district placeable and testable with district-level adjacency, text, icons, and project wiring.
    allowed_files:
      - Civ Supply Chains/Data/CSC_Q_TAILORS.sql
      - Civ Supply Chains/Data/CSC_RESOURCES.sql
      - Civ Supply Chains/Data/CSC_A_RESOURCES.sql
      - Civ Supply Chains/Icons/CSC_TAILORS_ICONS.sql
      - Civ Supply Chains/Text/CSC_TAILORS_TEXT.sql
      - Civ Supply Chains/Lua_UI/Ruivo_Adjacencies/CSC_Ruivo_AdjacencyProcessor.sql
      - Civ Supply Chains/ModSupport/ModSupport_CL.sql
      - Civ Supply Chains/ModSupport/ModSupport_CL_TEXT.sql
      - Civ Supply Chains/ModSupport/ModSupport_R2.sql
      - Civ Supply Chains/ModSupport/ModSupport_R2_A.sql
      - Civ Supply Chains/ModSupport/ModSupport_SR.sql
      - Civ Supply Chains/ModSupport/ModSupport_CH.sql
      - Civ Supply Chains/ModSupport/ModSupport_LAR_A.sql
      - project/localization/CSC_TAILORS_TEXT.md
      - project/localization/ModSupport_CL_TEXT.md
      - project/modbuddy/CivSupplyChains.actions.json
    forbidden_files:
      - Civ Supply Chains/Data/CSC_Q_BAKERS*.sql
    produce:
      types:
        - {type: DISTRICT_CSC_TAILORS_QUARTER, kind: KIND_DISTRICT}
      localization:
        source: project/localization/CSC_TAILORS_TEXT.md
        generated: Civ Supply Chains/Text/CSC_TAILORS_TEXT.sql
        required_loc:
          - LOC_DISTRICT_CSC_TAILORS_QUARTER_NAME
          - LOC_DISTRICT_CSC_TAILORS_QUARTER_DESCRIPTION
        modsupport_text:
          - source: project/localization/ModSupport_CL_TEXT.md
            generated: Civ Supply Chains/ModSupport/ModSupport_CL_TEXT.sql
            criteria: ModSupport_CL
            required_patch: LOC_DISTRICT_CSC_TAILORS_QUARTER_DESCRIPTION includes CL Urban Borough and Rural Community adjacency wording when City Lights is active.
      district_row:
        district_type: DISTRICT_CSC_TAILORS_QUARTER
        prereq_civic: CIVIC_CRAFTSMANSHIP
        cost: 60
        maintenance: 1
        requires_placement: true
        requires_population: false
        one_per_city: true
      tags:
        resources:
          - CLASS_CSC_TAILORS_BASE
          - CLASS_CSC_TAILORS_SPEC
        districts:
          - CLASS_CSC_TAILORS_SALES
          - CLASS_CSC_TAILORS_SALES_PRODUCTION
          - CLASS_CSC_TAILORS_SALES_CULTURE
      adjacency_config:
        - {source_tag: CLASS_CSC_TAILORS_BASE, yield_type: YIELD_PRODUCTION, yield_change: 1}
        - {source_tag: CLASS_CSC_TAILORS_SPEC, yield_type: YIELD_PRODUCTION, yield_change: 1}
      icons:
        - ICON_DISTRICT_CSC_TAILORS_QUARTER
        - DISTRICT_CSC_TAILORS_QUARTER
        - TAILORS
        - ICON_DISTRICT_CSC_TAILORS_QUARTER_FOW
    verify:
      static:
        - SQL parses in SQLite smoke harness.
        - Ruivo processor emits Tailors material and river adjacency rows.
        - ModSupport_CL_TEXT patches Tailors' district description for City Lights Urban Borough and Rural Community adjacency text.
        - IconDefinitions uses quoted 'Index' and loads through UpdateIcons.
        - ModBuddy action JSON check passes after action changes.
      runtime:
        - District appears in city production after Craftsmanship.
        - District can be placed.
        - Placement tooltip and adjacency preview show material, customer, and river bonuses.

  phase_3_textile_workshop:
    status: partial
    objective: Implement the stage-2 intermediary goods building and Sailmaker service.
    allowed_files:
      - Civ Supply Chains/Data/CSC_Q_TAILORS.sql
      - Civ Supply Chains/Data/CSC_Q_TAILORS_GOLD.sql
      - Civ Supply Chains/Data/CSC_Q_TAILORS_MC_MODE.sql
      - Civ Supply Chains/Data/CSC_Q_TAILORS_MC_MODE_GOLD.sql
      - project/localization/**
      - Civ Supply Chains/Text/CSC_QUARTERS_PEDIA.sql
      - Civ Supply Chains/Icons/CSC_TAILORS_ICONS.sql
      - Civ Supply Chains/Lua_UI/ArtProperties/CSC_ArtProperties.lua
      - project/modbuddy/CivSupplyChains.actions.json
    allowed_with_art_phase:
      - Civ Supply Chains/ArtDefs/CSC_Buildings.artdef
      - Civ Supply Chains/ArtDefs/CSC_StrategicView.artdef
      - Civ Supply Chains/ArtDefs/CSC_Landmarks.artdef
      - Civ Supply Chains/Assets/CSC_TAILORS_Textile_Workshop.ast
      - Civ Supply Chains/XLPs/CSC_Tilebases.xlp
    forbidden_files:
      - Civ Supply Chains/Data/CSC_Q_BAKERS*.sql
    produce:
      vertical_slice:
        reference: BUILDING_CSC_BAKERS_WIND_MILL
        standard: Textile Workshop must be complete across gameplay, optional-mode support, player-facing discovery, dynamic art, project wiring, and runtime validation before Phase 3 is marked implemented.
        intentional_non_parity:
          - Textile Workshop is a single stage-2 building; it does not need Water Mill/Wind Mill terrain variants, river-access flags, or mutually-exclusive building rules.
          - Sailmaker is a one-per-Harbor persistent service; it does not need the Storekeeper's stacking growth-effect notifications.
      building:
        type: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
        prereq_district: DISTRICT_CSC_TAILORS_QUARTER
        prereq_tech: TECH_CONSTRUCTION
        cost: 80
        maintenance: 2
      transactions:
        - id: base_material_to_textile_workshop
          source: adjacent_improved_base_material
          destination: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
          scope:
            adjacency: adjacent
            ownership: same_player
            source_requires_resource_tag: CLASS_CSC_TAILORS_BASE
            source_requires_improvement: true
          destination_receives: {YIELD_CULTURE: 1}
        - id: textile_workshop_pays_base_material
          source: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
          destination: adjacent_base_material_improvement
          scope:
            adjacency: adjacent
            ownership: same_player
            destination_requires_resource_tag: CLASS_CSC_TAILORS_BASE
            destination_requires_improvement: true
          destination_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
        - id: lighthouse_customer
          source: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
          destination: BUILDING_LIGHTHOUSE
          destination_district: DISTRICT_HARBOR
          scope:
            adjacency: adjacent
            ownership: same_player
            destination_requires_functioning: true
            building_replacements: direct_one_level
          destination_receives: {YIELD_PRODUCTION: 1}
          source_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
      gold_economy:
        required: true
        file: Civ Supply Chains/Data/CSC_Q_TAILORS_GOLD.sql
        action:
          id: CSC_Q_TAILORS_GOLD
          type: UpdateDatabase
          load_order: 101
        owns:
          - YIELD_GOLD to adjacent Base Materials improvements.
          - YIELD_GOLD return from adjacent Lighthouses to the Textile Workshop.
        rule: The core Tailors file must contain no Gold-yield modifier/action rows. Keep the Gold layer independently swappable by Taxes & Politics.
      monopolies_and_corporations:
        required: true
        core_file: Civ Supply Chains/Data/CSC_Q_TAILORS_MC_MODE.sql
        gold_file: Civ Supply Chains/Data/CSC_Q_TAILORS_MC_MODE_GOLD.sql
        core_action:
          id: CSC_Q_TAILORS_MC_MODE
          type: UpdateDatabase
          criteria: [Monopolies_Mode]
        gold_action:
          id: CSC_Q_TAILORS_MC_MODE_GOLD
          type: UpdateDatabase
          criteria: [Monopolies_Mode]
        material_tiers:
          source_resource_tag: CLASS_CSC_TAILORS_BASE
          industry:
            total_to_textile_workshop: {YIELD_CULTURE: 2}
            total_to_material_owner: {YIELD_PRODUCTION: 2, YIELD_GOLD: 2}
            increment_over_standard: {YIELD_CULTURE: 1, YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
          corporation:
            total_to_textile_workshop: {YIELD_CULTURE: 3}
            total_to_material_owner: {YIELD_PRODUCTION: 3, YIELD_GOLD: 3}
            increment_over_standard: {YIELD_CULTURE: 2, YIELD_PRODUCTION: 2, YIELD_GOLD: 2}
        rule: Core SQL owns the standard improvement tier only; M&C Culture/Production deltas belong in the core M&C file and M&C Gold deltas belong in the M&C Gold file. All M&C deltas must be absent unless Monopolies_Mode is active.
      service:
        key: sailmaker
        hidden_building: BUILDING_CSC_TAILORS_SAILMAKER
        unlock_civic: CIVIC_NAVAL_TRADITION
        hidden_building_row:
          prereq_district: DISTRICT_HARBOR
          must_purchase: true
          xp2_pillage: 0
        grant:
          destination_district: DISTRICT_HARBOR
          destination_building: BUILDING_LIGHTHOUSE
          scope:
            adjacency: adjacent
            ownership: same_player
            destination_requires_functioning: true
            building_replacements: direct_one_level
          source_requires:
            - BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
            - adjacent_improved_base_material
          cardinality: one_persistent_service_per_eligible_destination
        effects:
          naval_unit_production:
            percent: 20
            promotion_classes:
              - PROMOTION_CLASS_NAVAL_MELEE
              - PROMOTION_CLASS_NAVAL_RANGED
              - PROMOTION_CLASS_NAVAL_RAIDER
            eras:
              - ERA_ANCIENT
              - ERA_CLASSICAL
              - ERA_MEDIEVAL
              - ERA_RENAISSANCE
          great_person_points: {GREAT_PERSON_CLASS_ADMIRAL: 1}
        ui:
          grant_preview_loc: LOC_BUILDING_CSC_TAILORS_SAILMAKER_NAME
          ability_attachment:
            required: true
            source_modifier: MOD_CSC_TAILORS_SAILMAKER_SERVICE_ATTACH_HARBOR
            ability_icon: ICON_BUILDING_CSC_TAILORS_SAILMAKER
            ability_icon_target: BUILDING_CSC_TAILORS_SAILMAKER
          civilopedia:
            required_pages:
              - BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
              - BUILDING_LIGHTHOUSE
              - BUILDING_CSC_TAILORS_SAILMAKER
            required_chapters:
              - Supply Chains
              - Historical Context
      player_facing_text:
        - target_table: Buildings
          target: BUILDING_LIGHTHOUSE
          include_direct_replacements: true
          operation: append
          loc_key: LOC_CSC_TAILORS_SAILMAKER_EFFECT
        - target_table: Civics
          target: CIVIC_NAVAL_TRADITION
          operation: append_or_set_when_empty
          loc_key: LOC_CSC_TAILORS_SAILMAKER_CIVIC
      art_bridge:
        required: true
        source: BUILDING_LIGHTHOUSE
        destination: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
        scope:
          adjacency: adjacent
          ownership: same_player
          destination_requires_functioning: true
          building_replacements: direct_one_level
        source_property: CSC_TAILORS_STAGE_2_LIGHTHOUSE
        art_property: CSC_TAILORS_STAGE_2_LIGHTHOUSE_ART
        implementation:
          gameplay: A Lighthouse or direct replacement writes the source property to the adjacent Textile Workshop city when the customer transaction is active.
          bridge: CSC_ArtProperties.lua maps source_property to art_property.
          artdef: The Textile Workshop landmark SelectionRules consume art_property to reveal its active Lighthouse-customer state.
        separation_rule: The art-property gate follows the customer transaction only; it must not depend on Naval Tradition or Sailmaker eligibility.
    verify:
      static:
        - Building type, row, prereqs, text, and icons exist.
        - Core SQL grants only the standard Culture/Production improvement tier and contains no Gold-yield or M&C-only modifier/action rows.
        - Gold support file exists, is wired as CSC_Q_TAILORS_GOLD at load order 101, and contains all standard Gold-yield rows for Phase 3.
        - M&C core and Gold support files exist, are wired under Monopolies_Mode, and apply the declared Industry/Corporation deltas exactly once.
        - Lighthouse customer and service requirements enforce same-player adjacency, a functioning Lighthouse, and direct one-level Lighthouse replacements in every requirement, attachment, action modifier, text patch, and art bridge.
        - Sailmaker production modifiers cover exactly the declared promotion classes and eras.
        - Sailmaker grant uses a one-per-destination persistent hidden-building grant, exposes a ModifierStrings preview, and registers a non-null CSC_AbilityAttachModifiers row for Harbor-side discovery.
        - Lighthouse text appends its service note for the base building and direct replacements; Naval Tradition appends its note or initializes an empty Description without discarding a pre-existing one.
        - Textile Workshop, Lighthouse, and Sailmaker Supply Chains and Historical Context Civilopedia chapters exist and are registered through CSC_QUARTERS_PEDIA.
        - Lighthouse-to-Workshop gameplay property, CSC_ArtProperties Lua mapping, GamePropertyRanges/ArtDef property definition, and active-customer SelectionRule use the exact declared property names.
      runtime:
        - Textile Workshop appears only after Construction.
        - Standard improved Base Materials grant the declared Culture input and Production/Gold return only while adjacent and owned by the Textile Workshop player.
        - Gold returns disappear when CSC_Q_TAILORS_GOLD is excluded and otherwise match the declared standard values.
        - Industry and Corporation Base Materials grant the declared total tier values only when Monopolies_Mode is active.
        - Lighthouse exchange works in both directions, including a direct Lighthouse replacement, and stops while the destination Lighthouse is pillaged.
        - Each eligible adjacent Harbor receives one persistent Sailmaker after Naval Tradition; ineligible, foreign, non-adjacent, or no-Lighthouse Harbors receive none.
        - Sailmaker grants exactly +20% Production to Ancient through Renaissance naval melee, ranged, and raider units, and does not affect units outside that set.
        - Harbor-side Sailmaker ability feedback appears when the service is eligible, and the Sailmaker Civilopedia links resolve from the Workshop/Lighthouse service text.
        - The Textile Workshop active-customer art state appears for an adjacent functioning Lighthouse or direct replacement, disappears when that customer transaction is unavailable, and remains independent of Naval Tradition/Sailmaker state.

  phase_4_tailor:
    status: designed
    objective: Implement the stage-3 consumer goods building, Market/Temple customers, and Robemaker service.
    allowed_files:
      - Civ Supply Chains/Data/CSC_Q_TAILORS.sql
      - project/localization/**
      - Civ Supply Chains/Icons/CSC_TAILORS_ICONS.sql
      - project/modbuddy/CivSupplyChains.actions.json
    allowed_with_art_phase:
      - Civ Supply Chains/ArtDefs/CSC_Buildings.artdef
      - Civ Supply Chains/ArtDefs/CSC_StrategicView.artdef
      - Civ Supply Chains/ArtDefs/CSC_Landmarks.artdef
      - Civ Supply Chains/Assets/CSC_TAILORS_Tailor.ast
      - Civ Supply Chains/XLPs/CSC_Tilebases.xlp
    produce:
      building:
        type: BUILDING_CSC_TAILORS_TAILOR
        prereq_district: DISTRICT_CSC_TAILORS_QUARTER
        prereq_building: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
        prereq_civic: CIVIC_GUILDS
        cost: 160
        maintenance: 2
        citizen_slots: 1
        citizen_yields: {YIELD_CULTURE: 2, YIELD_GOLD: 1}
        city_amenities: 1
      transactions:
        - id: tailor_local_textile_purchase
          source: BUILDING_CSC_TAILORS_TAILOR
          destination: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
          source_receives: {YIELD_CULTURE: 1}
          destination_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
        - id: temple_customer_population_scaling
          source: BUILDING_CSC_TAILORS_TAILOR
          destination: BUILDING_TEMPLE
          scaling: per_city_citizen
          destination_city_receives: {YIELD_CULTURE: 0.1}
          source_city_receives: {YIELD_PRODUCTION: 0.1, YIELD_GOLD: 0.1}
        - id: market_customer_population_scaling
          source: BUILDING_CSC_TAILORS_TAILOR
          destination: BUILDING_MARKET
          scaling: per_city_citizen
          destination_city_receives: {YIELD_CULTURE: 0.1}
          source_city_receives: {YIELD_PRODUCTION: 0.1, YIELD_GOLD: 0.1}
      service:
        key: robemaker
        hidden_building: BUILDING_CSC_TAILORS_ROBEMAKER
        unlock_civic: CIVIC_DIVINE_RIGHT
        destination: adjacent_holy_site_with_temple
        effects:
          faith_percent: 10
          great_person_points: {GREAT_PERSON_CLASS_PROPHET: 1}
    verify:
      runtime:
        - Tailor appears only after Guilds and Textile Workshop.
        - Market and Temple customer paths work separately.
        - Robemaker grant is gated by Divine Right and improved Base Materials.

  phase_5_fashion_house:
    status: designed
    objective: Implement the stage-4 specialty goods building, Theater/Wonder customers, and Couturier service.
    allowed_files:
      - Civ Supply Chains/Data/CSC_Q_TAILORS.sql
      - Civ Supply Chains/Data/CSC_Q_TAILORS_MC_MODE.sql
      - project/localization/**
      - Civ Supply Chains/Icons/CSC_TAILORS_ICONS.sql
      - project/modbuddy/CivSupplyChains.actions.json
    allowed_with_art_phase:
      - Civ Supply Chains/ArtDefs/CSC_Buildings.artdef
      - Civ Supply Chains/ArtDefs/CSC_StrategicView.artdef
      - Civ Supply Chains/ArtDefs/CSC_Landmarks.artdef
      - Civ Supply Chains/Assets/CSC_TAILORS_Fashion_House.ast
      - Civ Supply Chains/XLPs/CSC_Tilebases.xlp
    produce:
      building:
        type: BUILDING_CSC_TAILORS_FASHION_HOUSE
        prereq_district: DISTRICT_CSC_TAILORS_QUARTER
        prereq_building: BUILDING_CSC_TAILORS_TEXTILE_WORKSHOP
        prereq_civic: CIVIC_HUMANISM
        cost: 250
        maintenance: 3
        flat_yields: {YIELD_CULTURE: 3}
        citizen_slots: 1
        citizen_yields: {YIELD_CULTURE: 1, YIELD_GOLD: 2}
        regional_amenity: {amount: 1, range: 6}
      transactions:
        - id: specialty_material_to_fashion_house
          source: adjacent_improved_specialty_material
          destination: BUILDING_CSC_TAILORS_FASHION_HOUSE
          destination_receives: {YIELD_CULTURE: 1}
        - id: fashion_house_pays_specialty_material
          source: BUILDING_CSC_TAILORS_FASHION_HOUSE
          destination: adjacent_specialty_material_improvement
          destination_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
        - id: amphitheater_customer_population_scaling
          source: BUILDING_CSC_TAILORS_FASHION_HOUSE
          destination: BUILDING_AMPHITHEATER
          scaling: per_5_city_citizens
          destination_city_receives: {YIELD_CULTURE: 1}
          source_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
        - id: culture_wonder_customer_population_scaling
          source: BUILDING_CSC_TAILORS_FASHION_HOUSE
          destinations:
            - BUILDING_BOLSHOI_THEATRE
            - BUILDING_BROADWAY
            - BUILDING_SYDNEY_OPERA_HOUSE
          scaling: per_5_city_citizens
          destination_city_receives: {YIELD_CULTURE: 1}
          source_receives: {YIELD_PRODUCTION: 1, YIELD_GOLD: 1}
      service:
        key: couturier
        hidden_building: BUILDING_CSC_TAILORS_COUTURIER
        unlock_civic: CIVIC_OPERA_BALLET
        effects:
          culture_percent: 10
          citizen_slots: 1
          wonder_established_bonus:
            great_person_points: {GREAT_PERSON_CLASS_ARTIST: 1}
    verify:
      runtime:
        - Fashion House appears only after Humanism and Textile Workshop.
        - Specialty input and M&C scaling work.
        - Theater and Wonder customer paths work separately.
        - Regional Amenity, Couturier, and Great Artist point behavior are verified.

