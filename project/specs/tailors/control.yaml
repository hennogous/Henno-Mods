approval_rule: >
  Each phase is approved independently by the user against the exact design
  subtrees named by that phase's design_refs; their canonical slice hash is
  recorded on the gate. Implementation contracts and pattern catalogs remain
  machine-validated implementation inputs rather than extra user approvals. Any
  open engine decisions must be resolved as approved exceptions or contract amendments. The
  implementation agent may then move it through implementing and
  ready_for_review only after the phase validator passes. User acceptance is a
  separate accepted state. No approval or acceptance is inferred from generated
  code or a successful test.
