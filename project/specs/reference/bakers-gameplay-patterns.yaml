schema_version: 1
catalog_id: bakers-gameplay
purpose: >
  Classified implementation patterns extracted from the finished Bakers' Quarter.
  This is a reference library, not permission to copy every Bakers peculiarity.
reference_files:
  core: Civ Supply Chains/Data/CSC_Q_BAKERS.sql
  gold: Civ Supply Chains/Data/CSC_Q_BAKERS_GOLD.sql
  monopolies: Civ Supply Chains/Data/CSC_Q_BAKERS_MC_MODE.sql
  monopolies_gold: Civ Supply Chains/Data/CSC_Q_BAKERS_MC_MODE_GOLD.sql

classifications:
  reusable_invariant: Preserve the structure unless the design explicitly requires otherwise.
  reusable_parameterized: Reuse with every listed parameter supplied by the Quarter contract.
  specialized_optional: Use only when the design calls for this mechanic.
  bakers_only: Do not inherit without an explicit design requirement.

quarter_icon_atlas_layout:
  district_normal: 0
  district_fow: 1
  stage2_building: 4
  stage3_building: 5
  stage4_building: 6
  stage2_service: 8
  stage3_service: 9
  stage4_service: 10

quarter_icon_atlas_layout:
  district_normal: 0
  district_fow: 1
  stage2_building: 4
  stage3_building: 5
  stage4_building: 6
  stage2_service: 8
  stage3_service: 9
  stage4_service: 10

patterns:
  - id: GP.FILE.SECTION_ORDER
    classification: reusable_invariant
    source_anchor: "CSC_Q_BAKERS.sql: numbered section headers"
    invariant:
      - "Quarter SQL is ordered: types, tags, material interactions, district, buildings, modifiers, requirements, scaling, strings."
      - "Gold and Monopolies & Corporations deltas remain in companion files."

  - id: GP.TYPE.QUARTER_OBJECTS
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: Types"
    parameters: [district_type, building_types, hidden_service_types, custom_modifier_types]
    invariant:
      - "All identifiers use CSC naming conventions."
      - "Hidden services are Buildings, not placeholder modifiers."

  - id: GP.TAG.MATERIAL_CLASSES
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: Resource tags"
    parameters: [quarter, base_resources, specialty_resources]
    invariant:
      - "Create CLASS_CSC_<Q>_BASE and CLASS_CSC_<Q>_SPEC as RESOURCE_CLASS tags."
      - "Map core resources in the owning Quarter SQL; optional-mod mappings remain in ModSupport."

  - id: GP.MATERIAL.IMPROVEMENT_FROM_BUILDING
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: ImprovementModifiers material transactions"
    parameters: [material_class, source_building, yields, standard_amounts]
    invariant:
      - "Attach at the resource improvement."
      - "Require adjacency to the source building, matching material tag, and same owner."

  - id: GP.MATERIAL.BUILDING_FROM_IMPROVEMENT
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: Quarter building material transactions"
    parameters: [material_class, destination_building, yields, standard_amounts]
    invariant:
      - "Attach at the Quarter building and affect adjacent player improvements."
      - "Require matching material tag, an improvement, adjacency, and same owner."

  - id: GP.MC.MATERIAL_TOTALS
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS_MC_MODE.sql and CSC_Q_BAKERS_MC_MODE_GOLD.sql"
    parameters: [direction, material_class, source_building, standard_total, industry_total, corporation_total, yields]
    invariant:
      - "Industry and Corporation behavior loads only in M&C mode."
      - "The contract states whether SQL amounts are totals or deltas."
      - "Gold rows remain in the Gold companion."

  - id: GP.DISTRICT.DEFINITION
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: Districts"
    parameters: [district_type, name_key, description_key, prerequisite, cost, maintenance, citizen_yields]
    invariant:
      - "District is unique, specialty, and one per city."
      - "Design values are copied exactly."

  - id: GP.DISTRICT.MATERIAL_ADJACENCY
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: CSC_QuarterMaterialAdjacencyConfig"
    parameters: [quarter, material_classes, yield, amount]
    invariant:
      - "Use the shared CSC material-adjacency configuration."
      - "Do not hand-duplicate generated MAB material rows."

  - id: GP.DISTRICT.BILATERAL_ADJACENCY
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: Ruivo_New_Adjacency district transactions"
    parameters: [source_district, customer_districts_or_tags, source_yield, return_yield, amounts]
    invariant:
      - "Both sides of the exchange are specified and tested."
      - "Use MAB tags where the design addresses a customer class."
      - "Every class-valued MAB CustomAdjacentObject has a Ruivo_CAO row whose Name resolves through a readable localization key; a player-facing tooltip must never fall back to a raw CLASS_CSC_* identifier."
      - "Quarter-specific tags with the same player-facing role may share the same generic localized role name and overlay, as Bakers and Tailors goods-provider classes share LOC_CLASS_CSC_GOODS_PROVIDER_NAME and CSC_Goods_Provider."

  - id: GP.DISTRICT.RIVER_EDGES
    classification: specialized_optional
    source_anchor: "CSC_Q_BAKERS.sql: river adjacency"
    parameters: [yield, amount, tiles_required]
    invariant:
      - "Represent 'every N river edges' with the established river adjacency mechanism."

  - id: GP.BUILDING.DEFINITION
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: Buildings, Buildings_XP2, BuildingPrereqs"
    parameters: [building_type, prerequisite, prerequisite_building, cost, maintenance, citizen_slots, intrinsic_yields]
    invariant:
      - "Expansion fields and prerequisite rows are explicit."
      - "Gold maintenance belongs to the core Buildings row; transactional Gold modifiers belong in the Gold companion."

  - id: GP.BUILDING.LOCAL_EXCHANGE
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: local stage BuildingModifiers"
    parameters: [source_building, destination_building, source_yields, return_yields]
    invariant:
      - "Local exchanges require both buildings to be present and functioning."
      - "Every direction has a matching design and localization obligation."

  - id: GP.BUILDING.CUSTOMER_TRANSACTION
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: customer BuildingModifiers and requirements"
    parameters: [source_building, customer_buildings_or_districts, customer_yields, return_yields, scaling]
    invariant:
      - "Require adjacency, same owner, correct destination, and functioning required building."
      - "Record both customer benefit and Quarter return."
      - "Do not gate an adjacent-building transaction on the Quarter's adjacent material supply. Material supply gates the related Service, not the underlying sale."
      - "The exception is the Stage 2 transaction with a material supplier itself, whose resource, improvement, and adjacency define the transaction."

  - id: GP.BUILDING.CITIZEN_YIELDS
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: Building_CitizenYieldChanges"
    parameters: [building_type, slots, specialist_yields]
    invariant:
      - "Citizen slots and every specialist yield are explicit contract values."

  - id: GP.BUILDING.CITY_AMENITY
    classification: specialized_optional
    source_anchor: "CSC_Q_BAKERS.sql: city amenity modifiers"
    parameters: [source_building, amount]
    invariant:
      - "Amenity is modeled as an amenity, not as a yield."

  - id: GP.BUILDING.REGIONAL_AMENITY
    classification: specialized_optional
    source_anchor: "CSC_Q_BAKERS.sql: regional city modifiers"
    parameters: [source_building, amount, radius]
    invariant:
      - "Radius and affected cities match the design exactly."

  - id: GP.SCALING.PER_POPULATION_DECIMAL
    classification: specialized_optional
    source_anchor: "CSC_Q_BAKERS.sql: population-scaled property-bit modifiers"
    parameters: [source_building, customer_targets, customer_yield, return_yields, amount_per_citizen]
    invariant:
      - "Gameplay amount, preview amount, and localization amount agree."
      - "The implementing Lua/property-bit path is named in the implementation contract."
    risk: high

  - id: GP.SCALING.PER_N_POPULATION_INTEGER
    classification: specialized_optional
    source_anchor: "CSC_Q_BAKERS.sql: temporary customer table and population property bits"
    parameters: [source_building, customer_targets, customer_yield, return_yields, population_interval]
    invariant:
      - "Threshold is floor(population / interval)."
      - "All listed customer buildings and Wonders are covered without unintended recursive replacements."
    risk: high

  - id: GP.REPLACEMENT.DIRECT_ONE_LEVEL
    classification: reusable_invariant
    source_anchor: "CSC_Q_BAKERS.sql: customer replacement expansions"
    mechanism_policy:
      engine_inherited:
        - REQUIREMENT_CITY_HAS_BUILDING
        - REQUIREMENT_PLOT_DISTRICT_TYPE_MATCHES
        - MODIFIER_BUILDING_YIELD_CHANGE
      explicit_direct_one_level:
        - BuildingModifiers
        - building_and_district_description_appends
        - MAB_TypeTags_and_generated_return_adjacencies
        - Lua_building_and_district_type_lookups
      never_expand:
        - named_wonders
        - CSC_owned_buildings_and_districts
    invariant:
      - "Use the base type only where the Civ VI engine already recognizes BuildingReplaces or DistrictReplaces."
      - "Expand direct one-level replacements only for tables, text, tags, generated rows, and Lua lookups that do not inherit replacement semantics."
      - "Do not explicitly duplicate MODIFIER_BUILDING_YIELD_CHANGE for a replacement; the engine already applies it and duplicate rows double the effect."
      - "Do not recursively chase replacement chains."
      - "Each replacement-sensitive implementation requirement declares which mechanism policy applies to each surface."

  - id: GP.SERVICE.HIDDEN_BUILDING
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: hidden service Buildings and grant modifiers"
    parameters: [service_type, source_building, unlock, material_requirements, customer_requirement, destination]
    invariant:
      - "Service is a cost-zero MustPurchase hidden building granted persistently by modifiers."
      - "Grant requires the source building, unlock, supplied materials, adjacency, destination, and same owner."
      - "Buildings_XP2 Pillage is disabled."

  - id: GP.SERVICE.EFFECTS
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: service effect modifiers and ModifierStrings"
    parameters: [service_type, city_effects, great_person_points, discovery_text]
    invariant:
      - "Service effects attach at the service destination."
      - "Ability discovery and preview strings describe the same live effects."

  - id: GP.SERVICE.PRESENTATION_ANCHOR
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql: CSC_AbilityAttachModifiers and ModifierStrings; CSC_UI_DB_Dynamic.sql"
    parameters: [logical_ability, mechanical_attach_modifiers, presentation_anchor, primary_amount, service_icon, service_icon_target, notification_string_family]
    invariant:
      - "A mechanically split service exposes exactly one logical MCUIS city ability, icon, and notification stream."
      - "Exactly one mechanically real attach/effect pair is designated as the presentation anchor and inserted into CSC_AbilityAttachModifiers."
      - "Every unregistered mechanical sibling shares activation-equivalent owner and subject gates with the presentation anchor."
      - "Only the presentation anchor's child effect receives the aggregate Preview ModifierString and NEW, INCREASED, DECREASED, and REMOVED localization family."
      - "The aggregate Preview identifies the number of contributing service sources with the positive stack-count placeholder and pluralizes the source noun; omit that count only for a mechanically non-stacking service explicitly declared as an exception by its implementation contract."
      - "Unregistered mechanical siblings receive neither CSC_AbilityAttachModifiers rows nor independent notification string families."
      - "The helper row resolves to a non-NULL child modifier and uses the primary formatted effect Amount expected by MCUIS."
      - "Every CSC_AbilityAttachModifiers row declares NotificationQuarter explicitly; notification dispatch uses that field and never infers Quarter identity from modifier-name shape."
      - "Persistent service-grant state remains separate from the live effect anchor; removal text must not claim that the persistent service building or Citizen slot was removed."

  - id: GP.SERVICE.WONDER_VARIANTS
    classification: specialized_optional
    source_anchor: "CSC_Q_BAKERS.sql: stage-four service target expansion"
    parameters: [service_type, normal_customer, wonder_customers, wonder_only_effects]
    invariant:
      - "Each Wonder target is explicit."
      - "Wonder-only Great Person effects cannot leak to normal customers."

  - id: GP.TRADE.DOMESTIC_SUPPLY
    classification: specialized_optional
    source_anchor: "CSC_Q_BAKERS.sql plus Quarter trade-route Lua/UI consumers"
    parameters: [source_buildings, destination_yield, quarter_return_yields, origin_amenity, exclusion]
    invariant:
      - "Route is domestic and destination is supplied by the source building."
      - "Quarter return applies only if the origin lacks the Quarter."
      - "Amenity applies to the origin city."
      - "Gameplay, route preview, and UnitPanel display use the same property-bit contract."
    risk: high

  - id: GP.GOLD.COMPANION_SPLIT
    classification: reusable_invariant
    source_anchor: "CSC_Q_BAKERS_GOLD.sql and CSC_Q_BAKERS_MC_MODE_GOLD.sql"
    invariant:
      - "Transactional Gold modifier attachments and Gold arguments live in Gold companion files."
      - "Core files may still contain schema columns such as Maintenance."

  - id: GP.MODSUPPORT.RESOURCE_CLASS_MAPPING
    classification: reusable_parameterized
    source_anchor: "Civ Supply Chains/ModSupport/ModSupport_*.sql"
    parameters: [mod, resource_type, material_class, file]
    invariant:
      - "Optional resources are mapped only by their owning ModSupport file."
      - "Preserved mappings are validated as inputs and are not regenerated by the Quarter build."

  - id: GP.ART.PROPERTY_BRIDGE
    classification: reusable_parameterized
    source_anchor: "CSC_Q_BAKERS.sql, CSC_Q_TAILORS.sql, and Lua_UI/ArtProperties/CSC_ArtProperties.lua"
    parameters:
      - source_property
      - effect_content
      - mirrored_art_property
      - interval_property
      - building_type
      - service_activation_requirement_set
      - refresh_events
    invariant:
      - "The gameplay phase that implements the related Service also owns its SQL source property and CSC_ArtProperties.lua mirror; there is no separate art-integration contract phase."
      - "The implementation contract ends at the gameplay-visible source and mirrored city properties. Physical models, materials, ASTs, GamePropertyRanges, Landmarks, XLP entries, and Strategic View assets are integrated as one art pass after the final blend arrives."
      - "The SQL source property identifies an active adjacent Service relationship and is mirrored by CSC_ArtProperties.lua into a direct city property for later GamePropertyRanges selection."
      - "Use CSC_<QUARTER>_STAGE_<NUMBER>_EFFECT_<EFFECT_CONTENT> for the source, then append _ART for the art-facing property and _ACTIVE for the GamePropertyRanges interval."
      - "<EFFECT_CONTENT> is the effect-semantic segment immediately before the _ART or _ACTIVE suffix; it must be declared explicitly rather than inferred from a customer building name."
      - "Attach the property modifier directly to the Quarter building and give it the exact owner requirement set used by the related Service/effect attach modifiers."
      - "That shared requirement set includes the era unlock, required adjacent improved material supply, and at least one eligible adjacent Service customer."
      - "Do not create a reverse customer-building art attach modifier or a parallel art-only requirement set."

  - id: GP.BAKERS.STAGE2_VARIANTS
    classification: bakers_only
    source_anchor: "CSC_Q_BAKERS.sql: Water/Wind Mill variants"
    invariant:
      - "Do not transfer Bakers mutually exclusive stage-two variants to another Quarter."

  - id: GP.BAKERS.RIVER_FLAGS
    classification: bakers_only
    source_anchor: "CSC_Q_BAKERS.sql: river/no-river hidden flags"
    invariant:
      - "Do not transfer Bakers art/gameplay flag buildings unless separately designed."

  - id: GP.BAKERS.VANILLA_REPLACEMENT_DELETE
    classification: bakers_only
    source_anchor: "CSC_Q_BAKERS.sql: Water Mill/Palgum handling"
    invariant:
      - "Do not delete or replace vanilla buildings without an explicit design requirement."
