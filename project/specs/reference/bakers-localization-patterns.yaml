schema_version: 1
catalog_id: bakers-localization
purpose: >
  Reusable text contracts extracted from the Bakers localization source. Each
  pattern separately declares whether wording is exact, mechanically composed,
  structurally constrained but original, or curated with editorial judgment.
reference_file: project/localization/CSC_BAKERS_TEXT.md

global_rules:
  - "Markdown is the editable source; generated SQL is never edited by hand."
  - "Descriptions state only implemented behavior."
  - "Gameplay bullets follow design order."
  - "District bilateral adjacency uses ', and ... in return'."
  - "Local-building and cross-city building transactions use ', in exchange for ...'; same-city adjacent-customer transactions use ', and ... in return'."
  - "Adjacency transactions say `from each adjacent` by default so their stackability is explicit. Use `an adjacent` only when gameplay guarantees at most one participant or the owning implementation contract declares a non-stacking exception."
  - "Gold-only generated rows remain in the Gold localization output when the generator supports a split."
  - "Use existing icon tokens and Civ VI typography exactly."
  - "Authored building descriptions omit CitizenSlots, Building_CitizenYieldChanges, and intrinsic local/regional Amenity fields because Civ VI renders them automatically; cross-city transaction effects such as a trade-route origin Amenity remain explicit."
  - "MCUIS and notification state strings receive already-signed amount values from Lua; never prefix a dynamic amount placeholder with a literal sign or directional word such as 'less', 'lost', or 'fewer'."
  - "Classification describes the relationship to the Bakers reference; authorship_mode is the binding rule for how literally wording is reused."
  - "A source_anchor is evidence for structure and tone, not permission to transplant Bakers nouns or prose into a different Quarter when original prose is required."

authorship_modes:
  strict_template: "Follow the supplied template, sentence order, punctuation, terminology, and paragraph breaks exactly; substitute only declared slots and grammatically necessary articles/plurals."
  deterministic_composition: "Generate exact labels, lists, names, or append fragments from implementation data; do not embellish or paraphrase."
  structured_original_prose: "Preserve the required chapter order, paragraph architecture, factual scope, and any quoted sentence frame, but write fresh Quarter-specific prose rather than reskinning the Bakers wording."
  curated_integrated_prose: "Write original, flowing prose with editorial judgment so several interactions read as one coherent section; mechanical facts and required sentence/paragraph roles remain exact."
  mixed_by_surface: "The pattern contains separately identified strict/deterministic and original-prose surfaces; follow the authorship_guidance for each surface and never average the two into generic boilerplate."

district_description_order:
  - terrain_or_river
  - materials
  - rural_communities_if_city_lights
  - stage2_sales_if_return_differs
  - stage3_sales
  - stage4_sales_if_return_differs
  - other_quarter_outputs

building_description_order:
  - material_input
  - local_exchange
  - customer_output
  - downstream_output
  - trade_output
  - service

patterns:
  - id: LP.DISTRICT.SUMMARY
    classification: exact_bakers_parameterized
    applies_to: district_description
    authorship_mode: strict_template
    authorship_guidance: ["Substitute only the Quarter's industry noun phrase."]
    source_anchor: LOC_DISTRICT_CSC_BAKERS_QUARTER_DESCRIPTION
    template: "A district in your city specializing in {industry}."
    required_slots: [industry]

  - id: LP.DISTRICT.ADJACENCY_BULLET
    classification: exact_bakers_parameterized
    applies_to: district_description
    authorship_mode: strict_template
    authorship_guidance: ["Keep the yield-first sentence and `from each adjacent` wording exactly; substitute only declared values."]
    source_anchor: LOC_DISTRICT_CSC_BAKERS_QUARTER_DESCRIPTION
    template: "* +{amount} {yield_icon} {Yield} from each adjacent {target}."
    required_slots: [amount, yield_icon, Yield, target]

  - id: LP.DISTRICT.BILATERAL_BULLET
    classification: exact_bakers_parameterized
    applies_to: district_description
    authorship_mode: strict_template
    authorship_guidance: ["Keep both directions in one sentence using the exact `, and ... in return` construction."]
    source_anchor: LOC_DISTRICT_CSC_BAKERS_QUARTER_DESCRIPTION
    template: >
      * +{source_amount} {source_icon} {SourceYield} from each adjacent {target},
      and +{return_amount} {return_icon} {ReturnYield} in return.
    required_slots: [source_amount, source_icon, SourceYield, target, return_amount, return_icon, ReturnYield]
    invariant:
      - "The composed Quarter description follows district_description_order exactly, giving an input/process/output flow: terrain or river; materials; conditional Rural Communities; then sales districts by stage and returned yield; then any other Quarter outputs."
      - "Group sales districts in one bullet exactly when they return the same yield. Keep Stage 2 separate when its returned yield differs from Stages 3 and 4; combine Stages 3 and 4 when their returned yield matches; give Stage 4 its own bullet when that return differs from Stage 3."
      - "When City Lights is active, insert Rural Communities immediately after Materials and merge Urban Boroughs into the Stage 3 or Stage 4 sales bullet whose returned yield matches, normally Stage 3. Never leave Urban Boroughs as a separate bullet when a matching return-yield group exists."
      - "Public design docs may keep optional-mod interactions together in a `with City Lights` subsection for readability; the conditional UpdateText implementation must still compose the in-game description in canonical semantic order."

  - id: LP.MATERIAL.BULLET
    classification: exact_bakers_parameterized
    applies_to: building_description
    authorship_mode: strict_template
    authorship_guidance: ["Use the exact participant-facing transaction sentence and substitute only material class and implemented yields."]
    source_anchor: LOC_BUILDING_CSC_BAKERS_WATER_MILL_DESCRIPTION
    order_group: material_input
    template: >
      * +{received} from each adjacent {material_class} Materials improvement,
      in exchange for +{provided}.
    required_slots: [received, material_class, provided]

  - id: LP.MC.SUB_BULLET
    classification: design_extension_no_bakers_analogue
    applies_to: building_description
    authorship_mode: strict_template
    authorship_guidance: ["Use the exact Industry/Corporation sub-bullet; no flavour prose belongs on this surface."]
    order_group: material_input
    template: >
      * +{industry_total} {yield_list} from an Industry, and +{corporation_total}
      {yield_list} from a Corporation.
    required_slots: [industry_total, yield_list, corporation_total]
    invariant:
      - "This line is supplied by an UpdateText action gated by Monopolies_Mode; it must not appear in always-loaded text."

  - id: LP.STAGE2.CUSTOMER.NO_CITY_SUFFIX
    classification: exact_bakers_parameterized
    applies_to: building_description
    authorship_mode: strict_template
    authorship_guidance: ["Apply this as a strict wording constraint to the applicable customer transaction."]
    source_anchor: LOC_BUILDING_CSC_BAKERS_WATER_MILL_DESCRIPTION
    template: >
      * +{received} from each adjacent {customer}, and +{provided} in return.
    required_slots: [received, customer, provided]
    invariant:
      - "When the source and adjacent customer are necessarily in one city, use the exact `from each adjacent {customer}, and +{provided} in return` construction rather than a destination-city suffix."
      - "Reserve destination-city wording for cross-city transactions such as Stage 3 or Stage 4 population and trade returns."
      - "`Each adjacent` is the default and makes stacking explicit; a singular article requires a contracted non-stacking exception."

  - id: LP.SERVICE.STACKING_CIVIC
    classification: exact_bakers_parameterized
    applies_to: civic_description
    authorship_mode: strict_template
    authorship_guidance: ["Keep the open-line placement and `from each adjacent supplied` stacking phrase exact."]
    source_anchor: LOC_CSC_BAKERS_STAGE_3_CIVIC
    invariant:
      - "The civic append begins after an open line using the shared text-prefix convention."
      - "Where independently adjacent supplied buildings stack an effect, write 'from each adjacent supplied {source_building}' after the full effect bundle."

  - id: LP.LOCAL.EXCHANGE_BULLET
    classification: exact_bakers_parameterized
    applies_to: building_description
    authorship_mode: strict_template
    authorship_guidance: ["Substitute only the local participant and implemented yield bundles."]
    source_anchor: LOC_BUILDING_CSC_BAKERS_WATER_MILL_DESCRIPTION
    order_group: local_exchange
    template: >
      * +{received} from the local {target}, in exchange for +{provided}.
    required_slots: [received, target, provided]

  - id: LP.LOCAL.DOWNSTREAM_EXCHANGE_BULLET
    classification: exact_bakers_parameterized
    applies_to: building_description
    authorship_mode: strict_template
    authorship_guidance: ["Use for later local buildings that consume the current building's output; place it after the current building's direct end-customer transaction."]
    source_anchor: LOC_BUILDING_CSC_BAKERS_WATER_MILL_DESCRIPTION
    order_group: downstream_output
    template: >
      * +{received} from the local {target}, in exchange for +{provided}.
    required_slots: [received, target, provided]

  - id: LP.CUSTOMER.BILATERAL_BULLET
    classification: exact_bakers_parameterized
    applies_to: building_description
    authorship_mode: strict_template
    authorship_guidance: ["Keep the explicit stackable `each adjacent` cardinality, cross-city recipient wording, and exchange direction exact; substitute only declared slots."]
    source_anchor: LOC_BUILDING_CSC_BAKERS_BAKERY_DESCRIPTION
    order_group: customer_output
    template: >
      * +{received} from each adjacent {customer}, in exchange for +{provided} to the
      {customer_city}.
    required_slots: [received, customer, provided, customer_city]
    invariant:
      - "Use `each adjacent` unless the owning implementation contract explicitly declares that multiple qualifying adjacent customers cannot stack."

  - id: LP.BUILDING.ENGINE_RENDERED_STATS_OMITTED
    classification: design_extension_no_bakers_analogue
    applies_to: building_description
    authorship_mode: deterministic_composition
    authorship_guidance:
      - "Omit the described building's CitizenSlots, Building_CitizenYieldChanges, and intrinsic local or regional Amenity fields: Civ VI renders them automatically below the authored description."
      - "Keep transaction effects granted to another city explicit, including an Amenity granted to a trade-route origin city."
    invariant:
      - "The authored building description contains no Citizen-slot/specialist-yield bullet sourced from engine-rendered building fields."
      - "The authored building description contains no standalone local or regional Amenity bullet sourced from engine-rendered building fields."

  - id: LP.SERVICE.INTRO
    classification: exact_bakers_parameterized
    applies_to: building_description
    authorship_mode: strict_template
    authorship_guidance: ["Use the exact unlock/source/service/destination sentence frame with only grammatical article changes."]
    source_anchor: LOC_BUILDING_CSC_BAKERS_WATER_MILL_DESCRIPTION
    order_group: service
    template: >
      At {unlock}, a supplied {source_building} establishes {service_article}
      {service_name} in {destination_condition}.
    required_slots: [unlock, source_building, service_article, service_name, destination_condition]
    invariant:
      - "Use 'supplied' only when the implemented material requirements are met."

  - id: LP.SERVICE.EFFECT
    classification: exact_bakers_parameterized
    applies_to: service_description
    authorship_mode: strict_template
    authorship_guidance: ["The normal Service description is dry gameplay text: preserve the two-sentence requirement/effect format and exact mechanics."]
    source_anchor: LOC_BUILDING_CSC_BAKERS_STAGE_2_SERVICE_DESCRIPTION
    template: >
      A Service established in {destination} at {unlock} when a supplied
      {source_building} {relationship} {customer_condition}. {effects}
    required_slots: [destination, unlock, source_building, relationship, customer_condition, effects]

  - id: LP.TRADE.DOMESTIC_BULLET
    classification: exact_bakers_parameterized_with_tailors_amenity_suffix
    applies_to: building_description
    authorship_mode: strict_template
    authorship_guidance: ["Preserve destination bonus, Quarter return, no-origin-Quarter condition, and origin Amenity in the declared order."]
    source_anchor: LOC_BUILDING_CSC_BAKERS_CAFE_DESCRIPTION
    order_group: trade_output
    template: >
      * +{destination_bonus} bonus to trade routes to the city,
      in exchange for +{quarter_return} to the Quarter, if the origin city does not
      have a {quarter_name}. +{origin_amenity} to the origin city.
    required_slots: [destination_bonus, quarter_return, quarter_name, origin_amenity]

  - id: LP.PEDIA.DISTRICT_CHAPTERS
    classification: exact_bakers_structure
    applies_to: pedia
    authorship_mode: mixed_by_surface
    authorship_guidance:
      - "Base Materials, Specialty Materials, Goods Providers, and Sales Districts use exact headers and deterministic implementation-derived lists."
      - "Historical Context uses original Quarter-specific prose whose progression implicitly reflects the canonical design; never call it an arc, announce the structure, or reskin the Bakers history."
    source_anchor: LOC_PEDIA_DISTRICTS_PAGE_DISTRICT_CSC_BAKERS_QUARTER_CHAPTER_CSCBASE_TITLE
    required_chapters: [CSCBASE, CSCSPEC, CSCGOODS, CSCSALES, HISTORY]
    invariant:
      - "Supply-chain chapters describe the implemented stage roles."
      - "Use the exact unadorned title text Base Materials, Specialty Materials, Goods Providers, Sales Districts, and Historical Context; never put icon tokens in pedia section headers."

  - id: LP.PEDIA.RESOURCE_REVERSE_APPEND
    classification: exact_bakers_structure
    applies_to: pedia
    authorship_mode: deterministic_composition
    authorship_guidance: ["Compose only the exact role labels and Quarter bullets from active mappings; no flavour sentence is added."]
    source_anchor: LOC_PEDIA_DISTRICTS_PAGE_DISTRICT_CSC_BAKERS_QUARTER_CHAPTER_CSCBASE_TITLE
    invariant:
      - "Every mapped resource receives one Supply Chains chapter naming its material role and Quarter."
      - "Core resource mappings are emitted with the Quarter's core text; optional mappings are emitted only by a text action with the same criteria as their mapping."
      - "If a resource participates in multiple Quarters, its one Supply Chains section is appended/composed rather than replaced."
      - "Group all Base-material Quarter entries under one Base Materials list and all Specialty-material Quarter entries under one Specialty Materials list; never repeat one-line role labels."
      - "The exact group labels are `Base Materials:` and `Specialty Materials:`. Each mapped Quarter is a separate `[ICON_BULLET] [ICON_<QUARTER>] <Quarter name>` line beneath the applicable label."
      - "Put exactly `[NEWLINE][NEWLINE]` between each role label and its first bullet; use one `[NEWLINE]` between subsequent Quarter bullets in the same list."
      - "A role label appears at most once per resource page and a Quarter appears at most once beneath that role, even when several Quarter text actions contribute to the same resource."
      - "The Quarter-side material list and the resource-side reciprocal list are an inseparable pair: the same conditional UpdateText action must add both or neither."
      - "Every conditional resource mapping declares and validates its gameplay action criteria, text action criteria, generated text file, Content entry, Quarter-side entry, and reciprocal resource-page entry as one binding."

  - id: LP.PEDIA.SALES_DISTRICT_APPEND
    classification: exact_bakers_structure
    applies_to: pedia
    authorship_mode: curated_integrated_prose
    authorship_guidance:
      - "Write a fresh evocative relationship sentence for the district and Quarter, followed by a mechanically exact gameplay sentence."
      - "For Commercial Hub, future Encampment, and other high-participation pages, rewrite the complete section as one coherent passage rather than concatenating Quarter templates."
      - "For City Lights district families, write one Quarter-agnostic integrated passage per page, not one contribution per Quarter."
    source_anchor: LOC_PEDIA_DISTRICTS_PAGE_DISTRICT_ENTERTAINMENT_COMPLEX_CHAPTER_CSCHAIN_PARA_1
    invariant:
      - "Each sales district has exactly one Supply Chains chapter title."
      - "For an ordinary sales district, Quarter-specific participation is appended to that chapter and never replaces other Quarter participation text."
      - "Each Quarter contribution has one evocative relationship sentence and one separate mechanically precise sentence. Shared commercial districts are curated as a flowing combined section."
      - "A high-participation shared district such as the Commercial Hub or a future Encampment is an explicit exception to fragment appends: one compatibility or integration source owns and rewrites the complete, flowing section, naming every currently active Quarter interaction without repetitive boilerplate."
      - "Conditional sales districts receive their Supply Chains title and prose only from a text action gated by the same mod criteria as their gameplay interaction."
      - "A conditional district family shared by many Quarters, such as City Lights Rural Communities or Urban Boroughs, receives exactly one integrated Supply Chains title and one integrated prose entry per district page, never one chapter or paragraph per Quarter."
      - "The shared district-page prose explains the district family's aggregate supply-chain role and return exchange without hard-coding the current Quarter roster; each participating Quarter page separately lists the district under Goods Providers or Sales Districts."

  - id: LP.PEDIA.BUILDING_CHAPTERS
    classification: exact_bakers_structure
    applies_to: pedia
    authorship_mode: structured_original_prose
    authorship_guidance:
      - "Copy the Bakery/Café chapter count and factual progression required by the owning implementation requirement, but write original prose for the Tailor or Fashion House."
      - "The Bakers page is a structural and tonal reference only; do not perform noun substitution on its sentences."
    source_anchor: LOC_PEDIA_BUILDINGS_PAGE_BUILDING_CSC_BAKERS_WATER_MILL_CHAPTER_CSCHAIN_TITLE
    required_chapters: [CSCHAIN, HISTORY]
    invariant:
      - "Every visible Quarter producer building has exactly one Supply Chains chapter followed by one Historical Context chapter; never add a duplicate Civilopedia Description chapter."
      - "The Supply Chains prose narrates the complete implemented flow from upstream inputs through the building's transformed goods to its customer classes, without becoming a dry modifier list."
      - "Historical Context explains the real trade or institution and follows the building's designed progression from production inputs to its markets or cultural destinations without calling that progression an arc."
      - "Use the exact unadorned titles `Supply Chains` and `Historical Context`; icons belong in prose, not chapter headers."

  - id: LP.PEDIA.SERVICE_CHAPTERS
    classification: exact_bakers_structure
    applies_to: pedia
    authorship_mode: structured_original_prose
    authorship_guidance:
      - "Follow the upstream-flow paragraph and employment paragraph architecture strictly, including the quoted employment sentence frame."
      - "Write fresh profession-specific imagery and Historical Context; do not convert Innkeeper prose by replacing nouns."
    source_anchor: LOC_PEDIA_BUILDINGS_PAGE_BUILDING_CSC_BAKERS_STAGE_3_SERVICE_CHAPTER_CSCHAIN_TITLE
    required_chapters: [CSCHAIN, HISTORY]
    invariant:
      - "Every visible Service building page has exactly two CSC-authored chapters, in order: Supply Chains and Historical Context; do not add a duplicate Description chapter."
      - "The Supply Chains paragraph first names the upstream producer, its material inputs, the goods it makes, and the customer or destination receiving that flow."
      - "After exactly one `[NEWLINE][NEWLINE]`, the second paragraph uses `This gives a Citizen the opportunity to take up employment as a <Service> in the <district>...` and expresses the implemented effect in-world."
      - "The Historical Context paragraph explains the real occupation and how its work connects the upstream goods flow to the service's destination and gameplay theme."
      - "Dry prerequisites, unlock timing, and exact numerical effects remain in the normal building Description and are not duplicated as a Civilopedia Description chapter."

  - id: LP.PEDIA.CUSTOMER_APPEND
    classification: exact_bakers_structure
    applies_to: pedia
    authorship_mode: curated_integrated_prose
    authorship_guidance:
      - "Integrate the new Quarter relationship into the page's existing Supply Chains voice and flow; do not append generic one-line boilerplate when several Quarters participate."
      - "Keep the gameplay transaction and Service-page pointer mechanically exact even while the surrounding prose is original."
    source_anchor: LOC_PEDIA_BUILDINGS_PAGE_BUILDING_GRANARY_CHAPTER_CSCHAIN_TITLE
    invariant:
      - "Patch every affected vanilla customer building or Wonder with its Tailors interaction."
      - "The append text is generated from the same implementation requirement as gameplay."
      - "A customer or destination page has one shared Supply Chains section integrating all Quarter relationships; it never receives one separate section per Quarter."
      - "When the customer enables a Service, the same integrated section concisely names the supplied producer and unlock, says the Service can be established there, and points readers to the Service Civilopedia page for full requirements and effects."
      - "Base types and direct one-level replacements receive equivalent prose wherever localization does not inherit automatically; named Wonders are updated only when explicitly listed by the design."

  - id: LP.CIVIC.APPEND
    classification: exact_bakers_structure
    applies_to: civic_description
    authorship_mode: strict_template
    authorship_guidance: ["The visible mechanics, bare/prefixed variants, and conditional composition are exact; only declared Quarter/service values change."]
    source_anchor: LOC_CSC_BAKERS_STAGE_2_CIVIC
    invariant:
      - "Append each service unlock to the prerequisite Civic description."
      - "Use [NEWLINE][NEWLINE] only when the base civic has visible description text and needs paragraph separation; omit text-prefix entirely when it has no base text, so the append begins with its first visible character."
      - "Implement the conditional explicitly with two localization variants containing identical visible prose: a bare key for NULL/empty base descriptions and a `[NEWLINE][NEWLINE]`-prefixed append key for non-empty base descriptions. The Civic or Technology SQL selects the variant from the existing Description value."

  - id: LP.NOTIFICATION.SERVICE_STATE
    classification: exact_bakers_structure_optional
    applies_to: notification
    authorship_mode: strict_template
    authorship_guidance: ["Follow the state-specific mechanical wording and placeholder/sign rules exactly; notifications are not a flavour-writing surface."]
    source_anchor: LOC_CSC_BAKERS_STAGE_2_EFFECT_DESCRIPTION_WATER_NEW
    variants: [NEW, INCREASED, DECREASED, REMOVED]
    invariant:
      - "Only include if the shared service notification subsystem will surface the service."
      - "Every state names the source and destination unambiguously."
      - "The first dynamic amount placeholder is pre-signed by the UI; present it directly (for example, '{1_NewAmount}%'), without a literal sign or directional qualifier."
      - "NEW, INCREASED, DECREASED, and REMOVED state fragments contain no terminal period, exclamation mark, or question mark because the shared notification summary owns and appends the single final period after `{2_Ability}`. Internal sentence punctuation is allowed when a fragment contains more than one sentence."

  - id: LP.NAMES.COMPLETE
    classification: exact_bakers_structure
    applies_to: names
    authorship_mode: deterministic_composition
    authorship_guidance: ["Emit the canonical design names exactly for every required object and UI alias."]
    source_anchor: LOC_DISTRICT_CSC_BAKERS_QUARTER_NAME
    required:
      - district name
      - stage building names
      - service names
      - adjective or Quarter short name used by UI
